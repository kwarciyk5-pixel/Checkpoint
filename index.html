<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkpoint</title>
<meta name="description" content="Trading-discipline checklists, trade locks and cooldowns.">
<meta name="theme-color" content="#F4EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checkpoint">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ==== STYLE: tokens ==== */
/* Paper. Light by default; [data-theme="dim"] after 19:00 TH or when the OS is dark (Settings: auto / light / dim).
   Legacy names (--surface, --accent, --lock, --info ...) are mapped onto Paper so older views keep working. */
:root{
  --bg:#F4EFE6; --ink:#1C1A17; --muted:#7A736A; --line:#DAD1C0; --ring:#E6DFD2;
  --wait:#B8AE9C; --live:#5E8C73; --cool:#C98A3D; --breach:#8A4B1F; --breach-bg:#F1DCCB;
  --font-serif:'Fraunces',Georgia,serif; --font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ink-2:#4A4640; --dim:#9A9285; --paper-2:#EDE6DA;
  --live-ink:#41705A; --cool-ink:#8E5A1A;
  --surface:transparent; --surface-2:var(--paper-2); --line-soft:var(--ring);
  --text:var(--ink); --text-2:var(--ink-2);
  --accent:var(--live-ink); --accent-a:rgba(94,140,115,.12); --accent-b:rgba(94,140,115,.25);
  --lock:var(--cool-ink); --lock-a:rgba(201,138,61,.12);
  --info:var(--ink-2); --info-a:rgba(28,26,23,.04);
  --danger-soft:var(--breach);
  --radius:4px;
  --f-head:var(--font-sans);
  --f-mono:var(--font-sans);
  --tabh:44px; --bandh:6px;
  color-scheme:light;
}
:root[data-theme="dim"]{
  --bg:#2A2724; --ink:#EDE6D6; --muted:#A39B8E; --line:#3E3A35; --ring:#363230;
  --ink-2:#CFC7B8; --dim:#7F776C; --paper-2:#322E2A;
  --live-ink:#8DBBA1; --cool-ink:#D9A15A; --breach:#E0A57A; --breach-bg:#4A3326;
  --accent-a:rgba(141,187,161,.12); --accent-b:rgba(141,187,161,.25);
  --lock-a:rgba(217,161,90,.12); --info-a:rgba(237,230,214,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:var(--font-sans);font-size:16px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:0}
h1{font-family:var(--font-serif);font-weight:400;font-size:30px;line-height:1.2}
h2{font-family:var(--font-sans);font-size:17px;font-weight:600}
.serif{font-family:var(--font-serif);font-weight:400}
.mono{font-family:var(--font-sans);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.accent{color:var(--accent)}
.amber{color:var(--lock)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ==== STYLE: layout + tabs ==== */
/* One column, phone width, everywhere (the floating window uses the same layout). */
#view{padding:calc(env(safe-area-inset-top) + var(--bandh) + 20px) 20px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px)}
body[data-nav="hidden"] #view{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.band{position:fixed;left:0;right:0;top:0;z-index:40;height:calc(env(safe-area-inset-top) + var(--bandh));background:var(--wait)}
.band[data-s="live"]{background:var(--live)}
.band[data-s="cool"]{background:var(--cool)}
.band[data-s="done"]{background:var(--ink)}
/* Bottom nav: hidden unless the current state shows it (render sets body[data-nav]). */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body[data-nav="show"] .tabs{display:flex}
.tabs .brand{display:none}
.tab{flex:1;max-width:108px;min-height:var(--tabh);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1.5px solid transparent;margin-top:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}

/* ==== STYLE: components ==== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.accent-card{border-color:var(--live)}
.card.lock-card{border-color:var(--cool);background:var(--lock-a)}
.card.info-card{border-color:var(--line);background:var(--info-a)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:4px;border:1.5px solid var(--ink);font-size:14px;font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.accent-o{border-color:var(--ink);color:var(--ink)}
.btn.lock-o{border-color:var(--cool);color:var(--lock)}
.btn.danger-o{border-color:var(--line);color:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.textbtn{min-height:44px;font-size:13px;color:var(--muted);padding:0 6px;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:4px;color:var(--muted);font-size:18px}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--info-a)}
.tag{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.amber{border-color:var(--cool);color:var(--lock)}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:4px;border-radius:0;background:var(--ring);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.banner{border-radius:var(--radius);padding:12px 14px;border:1px solid var(--line);background:var(--info-a);color:var(--text);font-size:14px}
.banner .mono{color:var(--ink-2);display:block;margin-bottom:2px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cb{width:22px;height:22px;flex:none;border:1.5px solid var(--dim);border-radius:3px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.cb svg{width:14px;height:14px;opacity:0}
.cb svg path{stroke:var(--bg)}
.cb.dashed{border-style:dashed}
[aria-pressed="true"] > .cb, .cb.on{background:var(--ink);border-color:var(--ink)}
[aria-pressed="true"] > .cb svg, .cb.on svg{opacity:1}

/* ==== STYLE: premarket ==== */
.page-head{display:flex;flex-direction:column;gap:10px;padding:4px 0 4px}
.now-strip .now-text{font-family:var(--font-serif);font-size:22px;font-weight:400;margin:6px 0 2px}
.now-strip .note{font-size:13px;color:var(--muted)}
.big-done{min-height:56px;width:100%;margin-top:12px;font-size:15px}
.next-line{margin-top:10px;font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.cat{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.cat-head{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.cat-head .chev{display:inline-block;transition:transform .2s;color:var(--dim);margin-right:8px}
.cat-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cat-body{border-top:1px solid var(--line-soft);padding:8px;display:flex;flex-direction:column;gap:6px}
.item{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line-soft);border-radius:4px;background:transparent}
.item[aria-pressed="true"]{border-color:var(--line)}
.item[aria-pressed="true"] .txt b{color:var(--ink-2)}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:500;display:block}
.item .txt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.item .time{font-size:12px;color:var(--muted)}
.item.optional{opacity:.55}
.item.gate{cursor:default}
.gate-btns{display:flex;gap:6px;flex:none}
.gate-btns button{min-width:48px;min-height:40px;border:1.5px solid var(--line);border-radius:4px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.gate-btns button[aria-pressed="true"].yes{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gate-btns button[aria-pressed="true"].no{border-color:var(--ink);color:var(--ink);background:var(--info-a)}
.focus-wrap{min-height:calc(100vh - 160px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:12px 0}
.focus-item{font-family:var(--font-serif);font-size:36px;line-height:1.15;font-weight:400}
.focus-note{font-size:14px;color:var(--muted)}
.focus-done{min-height:64px;font-size:17px}

/* ==== STYLE: trade ==== */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.rules .cell{background:none;border:0;border-right:1px solid var(--line);border-radius:0;padding:12px 8px;text-align:center}
.rules .cell:last-child{border-right:0}
.rules .cell b{display:block;font-family:var(--font-serif);font-size:22px;font-weight:400;margin-top:2px}
.session-bar{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 2px;border:0;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.counter{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.counter h2{font-family:var(--font-serif);font-weight:400;font-size:24px}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:10px;height:10px;border-radius:50%;border:1px solid var(--dim);background:transparent}
.pip.on{background:var(--ink);border-color:var(--ink)}
.enter{position:relative;width:100%;min-height:64px;border-radius:4px;overflow:hidden;font-size:16px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px}
.enter.off{border:1.5px dashed var(--line);color:var(--muted);font-size:13px;font-weight:500}
.enter.live{border:1.5px solid var(--ink);color:var(--bg);background:var(--ink)}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold::before{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--fill,0));background:currentColor;opacity:.18;pointer-events:none}
.enter.live.hold::before{background:var(--bg);opacity:.3}
.hold > span{position:relative}
.outcomes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.outcomes .btn{padding:0 4px}
.urge{width:100%;min-height:52px;border:1.5px solid var(--line);color:var(--muted);border-radius:4px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:10px}
.lock-title{font-family:var(--font-serif);font-size:22px;font-weight:400;margin:4px 0 6px}
.done-screen{text-align:center;padding:36px 18px}
.done-screen h1{font-size:30px;margin:10px 0 18px}
details.log-anyway summary{min-height:44px;display:flex;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
details.log-anyway summary::-webkit-details-marker{display:none}
.sub-head{display:flex;justify-content:space-between;align-items:center;margin-top:4px}

/* ==== STYLE: cooldown ==== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink-2);background:transparent}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--info-a)}
.chip.running[aria-pressed="true"]{border-color:var(--cool);color:var(--lock);background:var(--lock-a)}
.ring-wrap{position:relative;width:min(240px,70vw);aspect-ratio:1;margin:8px auto}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap svg circle[data-cd-ring]{stroke-linecap:butt}
.ring-wrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-wrap .big{font-family:var(--font-serif);font-size:48px;font-weight:400}
.steps{display:flex;flex-direction:column;gap:6px}
.step.current{border-color:var(--ink)}
.msg{font-family:var(--font-serif);font-size:19px;line-height:1.4}

/* ==== STYLE: settings + editors ==== */
.sec-title{font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:16px 2px 2px}
.list-row{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:0}
.list-row small{font-size:12px;color:var(--muted)}
.list-card{padding:0}
.field{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.field:last-child{border-bottom:0}
.field > label, .field > .lbl{font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.field .hint{font-size:12px;color:var(--dim)}
.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;min-height:44px;background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:16px}
textarea{min-height:76px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
.num-sm{max-width:110px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stepper button{width:48px;height:44px;font-size:20px;color:var(--ink-2)}
.stepper output{min-width:44px;text-align:center;font-size:16px}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:999px;border:1.5px solid var(--line);background:transparent;transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(21px);background:var(--bg)}
.switch-row{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-chips{display:flex;gap:6px;flex-wrap:wrap}
.day-chips button{width:44px;height:44px;border-radius:4px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.day-chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--bg);background:var(--ink)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-height:44px;font-size:14px;font-weight:500;color:var(--ink);border-right:1.5px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pending{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--cool);border-radius:4px;padding:4px 4px 4px 10px;color:var(--lock);font-size:12px;background:var(--lock-a);margin-top:6px}
.pending button{min-height:36px;padding:0 10px;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px}
.editor-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.editor-head h1{flex:1;font-size:24px}
.saved{font-size:11px;letter-spacing:.12em;color:var(--accent);opacity:0;transition:opacity .3s}
.saved.on{opacity:1;transition:none}
.handle{width:40px;height:44px;flex:none;display:grid;place-items:center;color:var(--dim);font-size:20px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dnd-cats{display:flex;flex-direction:column;gap:12px}
.ecat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px}
.ecat-bar{display:flex;align-items:center;gap:4px}
.ecat-bar input{text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.dnd-list{display:flex;flex-direction:column;gap:6px;padding:6px 0;min-height:14px}
.eitem{background:var(--bg);border:1px solid var(--line-soft);border-radius:4px}
.erow{display:flex;align-items:center;gap:2px}
.etext{flex:1;min-width:0;min-height:44px;text-align:left;padding:6px 4px;display:flex;align-items:center;gap:8px}
.etext .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.etext .t.empty{color:var(--dim)}
.etext .flags{display:flex;gap:4px;flex-wrap:wrap}
.eexp{padding:4px 10px 12px 12px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-soft)}
.add-btn{min-height:44px;width:100%;border:1px dashed var(--line);border-radius:4px;font-size:13px;color:var(--muted)}
.lifted{position:fixed !important;z-index:50;border-color:var(--ink) !important;box-shadow:0 10px 24px rgba(28,26,23,.18);transform:rotate(1.2deg);pointer-events:none;margin:0 !important}
.drop-ph{border:1.5px dashed var(--ink);border-radius:4px;display:grid;place-items:center;font-size:11px;letter-spacing:.12em;color:var(--muted);background:var(--info-a);min-height:44px}
body.dragging{user-select:none;-webkit-user-select:none}

/* ==== STYLE: check-ins + floating window ==== */
.ci-card{border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px}
.ci-label{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ci-text{margin:0;font-size:15px;line-height:1.5;color:var(--text-2)}
.ci-q{font-family:var(--font-serif);font-size:24px;font-weight:400}
.ci-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ci-answers button{min-height:56px;border-radius:4px;font-size:13px;font-weight:600;padding:0 6px}
.ci-answers .a-good{background:var(--ink);color:var(--bg)}
.ci-answers .a-notgood{background:transparent;color:var(--lock);border:1.5px solid var(--cool)}
.ci-answers .a-done{background:transparent;color:var(--text);border:1.5px solid var(--line);font-size:12px}
.ci-foot{font-size:12px;color:var(--muted)}
.ci-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--info-a);padding:6px 6px 6px 14px;font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--ink);text-transform:uppercase}
body.pipwin{min-height:100vh;background:var(--bg)}
.pw{min-height:100vh;display:flex;flex-direction:column;border-top:6px solid var(--wait)}
.pw.lit{border-top-color:var(--ink)}
.pw.cool{border-top-color:var(--cool)}
.pw-head{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line-soft);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pw-head .dot{width:8px;height:8px;border-radius:4px;background:var(--live)}
.pw-head b{flex:1;color:var(--text);font-weight:500}
.pw-body{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px}
.pw-sess{display:flex;flex-direction:column;gap:6px}
.pw-sess .top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pw-sess .top b{color:var(--text);font-weight:500}
.pw-sess .track{height:4px;background:var(--ring);overflow:hidden}
.pw-sess .track i{display:block;height:100%;background:var(--ink)}
.pw-count{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pw-count .n{font-family:var(--font-serif);font-size:36px;font-weight:400;line-height:1}
.pw-count .n span{color:var(--dim)}
.pw-count .side{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.pw .btn,.pw .urge{min-height:44px}
.pw-ring{display:flex;align-items:center;gap:16px}
.pw-ring .rw{position:relative;width:110px;height:110px;flex:none}
.pw-ring svg{width:110px;height:110px;transform:rotate(-90deg)}
.pw-ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:26px;font-weight:400}
.pw-steps{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.pw-steps button{min-height:30px;text-align:left;font-size:14px;font-weight:500;color:var(--text-2)}
.pw-steps button[aria-pressed="true"]{color:var(--muted);text-decoration:line-through}
.pw-note{padding:10px 12px;border-radius:4px;background:var(--lock-a);border:1px dashed var(--cool);font-size:12px;color:var(--lock)}
.pw-undo{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line-soft);padding:4px 4px 4px 14px;font-size:12px;color:var(--text-2)}
.pw-undo button{min-height:44px;padding:0 12px;color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline}
.pw .item{min-height:40px;padding:6px 10px}
.ci-row{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.ci-row:last-of-type{border-bottom:0}
.ci-row .ci-time{width:160px;max-width:42%;flex:none}
.ci-row textarea{min-height:88px}

/* ==== STYLE: home ==== */
/* The one working screen (Part B fills it). Fixed-height column: header · centre · actions. */
.home{min-height:calc(100dvh - var(--bandh) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - var(--tabh) - 48px);max-width:430px;margin:0 auto;display:flex;flex-direction:column}
body[data-nav="hidden"] .home{min-height:calc(100dvh - var(--bandh) - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 48px)}
.home-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.home-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:24px 0}
.home-foot{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
/* Part B: the home states. */
.home-head .big-n{font-family:var(--font-serif);font-size:44px;line-height:1;letter-spacing:0;text-transform:none;color:var(--ink)}
.home-head .big-n small{font-family:var(--font-sans);font-size:13px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-left:6px}
.home-head .textbtn{min-height:32px;padding:0;font-size:12px;letter-spacing:.08em}
.home-mid.top{justify-content:flex-start;align-items:stretch;gap:14px;padding-top:16px}
.home-line{font-family:var(--font-serif);font-size:30px;line-height:1.25;text-align:center;margin:0}
.home-sub{font-size:14px;color:var(--muted);text-align:center;margin:0}
.home-text{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.home-count{font-size:13px;color:var(--muted);letter-spacing:.04em;text-align:center}
.home-foot .btn{min-height:64px;font-size:16px}
.home-foot .textbtn{align-self:center}
.home-amber{font-size:13px;color:var(--cool-ink);border:1px dashed var(--cool);border-radius:4px;padding:10px 12px}
.home-note{font-size:12px;color:var(--muted);text-align:center}
.home-note button{min-height:36px;padding:0 6px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.rings{position:relative;width:240px;height:240px;flex:none}
.rings i{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
.rings i:nth-child(1){width:240px;height:240px}
.rings i:nth-child(2){width:170px;height:170px}
.rings i:nth-child(3){width:100px;height:100px}
.rings.outline i{border:1px solid var(--line)}
.rings.filled i:nth-child(1){background:var(--ring)}
.rings.filled i:nth-child(2){background:var(--line)}
.rings.filled i:nth-child(3){background:var(--bg)}
.rings.breathe{animation:cp-breathe 10s ease-in-out infinite}
@keyframes cp-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.wl{display:grid;width:100%;min-height:76px;align-items:center}
.wl span{grid-area:1/1;font-family:var(--font-serif);font-size:30px;line-height:1.25;text-align:center;opacity:0;transition:opacity 1s ease}
.wl span.on{opacity:1}
.outcome2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.outcome2 .btn{min-height:64px;font-size:16px}
.pick{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:4px}
.pick .dot{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--dim)}
.pick[aria-checked="true"]{border-color:var(--ink)}
.pick[aria-checked="true"] .dot{border:5px solid var(--ink)}
.pick:disabled{opacity:.45}
.pick .txt{flex:1;min-width:0}
.pick .txt small{display:block;font-size:12px;color:var(--muted)}
.home{width:100%}
.home .steps{gap:4px}
.home .steps .item{min-height:40px;padding:4px 10px;font-size:14px}
.home .ring-wrap{width:180px}
.home[data-hs="cooldown"] .home-mid{gap:16px;padding:12px 0}
.home-row{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px}
.done-circle{width:180px;height:180px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:52px;line-height:1}
.done-circle small{font-size:26px;color:var(--muted)}
.done-msg{font-family:var(--font-serif);font-size:16px;line-height:1.45;color:var(--muted);text-align:center;margin:0}
.home .so-row{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px solid var(--line);text-align:left}
.home .so-row:last-child{border-bottom:0}
/* Done is always the dark, inverted screen (both themes). */
:root[data-home="done"]{
  --bg:#1C1A17; --ink:#F4EFE6; --ink-2:#DAD1C0; --muted:#B8AE9C; --dim:#8A8276; --line:#3E3A35; --ring:#2E2B27; --paper-2:#2A2724;
  --live-ink:#9ED0B4; --accent-a:rgba(158,208,180,.12); --info-a:rgba(244,239,230,.05);
  color-scheme:dark;
}
:root[data-home="done"] .band{background:var(--live)}
:root[data-home="done"] .done-circle small{color:#7A736A}

/* ==== STYLE: today ==== */
/* Part C: premarket roll-ups (Body · Plan · Accounts · Desk), the Today card editor, the due-item line, Practising. */
.ru{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ru-sec{border-bottom:1px solid var(--line)}
.ru-row{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 2px}
.ru-name{flex:1;min-width:0;font-family:var(--font-serif);font-size:22px;line-height:1.2}
.ru-name small{display:block;font-family:var(--font-sans);font-size:12px;color:var(--muted);margin-top:2px}
.ru-name small:empty{display:none}
.ru-st{font-size:13px;color:var(--muted);white-space:nowrap}
.ru-st.ok{font-size:20px;color:var(--live-ink)}
.ru-row .chev{color:var(--dim);transition:transform .15s ease}
.ru-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ru-body{display:flex;flex-direction:column;gap:6px;padding:2px 0 14px}
.ru-body .item{min-height:44px;padding:6px 10px}
.ru-now{display:flex;align-items:center;gap:10px;border:1px solid var(--ink);border-radius:4px;padding:6px 6px 6px 12px;min-height:52px}
.ru-now-t{font-size:12px;color:var(--muted);letter-spacing:.06em}
.ru-now-x{flex:1;min-width:0;font-size:15px}
.ru-now .gate-btns{margin:0}
.ru-tick{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.ru-practise{margin:6px 0 0;font-family:var(--font-serif);font-size:22px;line-height:1.35;display:flex;flex-direction:column;gap:6px}
.ru-practise-empty{align-self:flex-start;margin-top:4px;padding-left:2px}
.card-ed{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.su-row{display:flex;flex-direction:column;gap:6px}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.grades .pill{min-height:36px;min-width:48px;padding:0 12px}
.ed-2{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.su-row textarea{min-height:64px;font-size:15px;line-height:1.35}
.ed-2 .grades{min-height:46px;align-items:center}
.ru-practise .eyebrow{font-family:var(--font-sans)}
.ed-2 > div{display:flex;flex-direction:column;gap:6px}
.card-ed .stepper{align-self:flex-start}

/* ==== STYLE: log + points ==== */
/* Part D: badge chips and Export on Done, the "not filled yet" line on Premarket. */
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.badge{font-size:12px;letter-spacing:.04em;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2)}
.home-foot .done-export{min-height:52px;font-size:15px}
.done-acts{display:flex;align-items:center;gap:12px}
.done-acts .done-export{flex:1}
.ru-fill{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:4px 4px 4px 12px}
.ru-fill-acts{display:flex;gap:2px}

/* ==== STYLE: stats + log ==== */
/* Part E: the Stats page (hero, calendar, edge, 2×2, per-day blocks vs cap, pass bar, baseline) and the Log list. */
.stats{max-width:430px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:4px;padding-bottom:24px}
.st-hero{padding:18px 0 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.st-big{font-family:var(--font-serif);font-size:72px;line-height:1}
.st-big small{font-size:30px;color:var(--muted);margin-left:2px}
.st-cap{font-size:14px;color:var(--muted)}
.st-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.st-row b{font-family:var(--font-serif);font-size:20px;font-weight:400;color:var(--ink);margin-right:2px}
.st-note{font-size:13px;color:var(--muted)}
.st-sec{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.st-sec:last-child{border-bottom:0}
.st-cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.st-day{height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid transparent;color:var(--muted)}
.st-day.clean{background:var(--ink);color:var(--bg)}
.st-day.sat{background:var(--wait);color:var(--ink)}
.st-day.breach{background:var(--cool);color:#1C1A17}
.st-day.unfilled,.st-day.today{border-color:var(--ink);color:var(--ink)}
.st-day.future{border:1px dashed var(--line)}
.st-day.pad{visibility:hidden}
.st-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.st-legend span{display:inline-flex;align-items:center;gap:6px}
.st-legend .st-day{display:inline-block;width:12px;height:12px;border-radius:2px}
.st-grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
.st-grid3 > div,.st-2x2 > div{display:flex;flex-direction:column;gap:2px}
.st-grid3 b,.st-2x2 b{font-family:var(--font-serif);font-size:24px;font-weight:400}
.st-grid3 small,.st-2x2 small{font-size:12px;color:var(--muted)}
.st-2x2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.st-2x2 > div{background:var(--bg);padding:12px}
.st-2x2 > div.b b{color:var(--cool-ink)}
.st-bars{position:relative;display:flex;align-items:flex-end;gap:4px;min-height:calc(var(--max) * 14px + 4px);padding-top:4px;border-bottom:1px solid var(--line)}
.st-bars::after{content:'';position:absolute;left:0;right:0;bottom:calc(var(--cap) * 14px);border-top:1px dashed var(--muted)}
.st-bar{flex:1;min-width:0;max-width:22px;display:flex;flex-direction:column-reverse;gap:2px}
.st-bar i,.st-blk{display:block;height:12px;background:var(--ink);border-radius:2px}
.st-bar i.early,.st-blk.early{background:transparent;border:1.5px solid var(--cool)}
.st-bar i.over{opacity:.5}
.st-blk{width:12px}
.st-base .st-row b{font-size:18px}
.st-sec .bar{flex:none;height:6px}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lg li{display:flex;gap:12px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.lg li:last-child{border-bottom:0}
.lg time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:42px}

/* ==== STYLE: modal + toast ==== */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(28,26,23,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal-back{align-items:center}}
.modal{width:100%;max-width:430px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.modal h2{font-family:var(--font-serif);font-weight:400;font-size:24px}
.modal p{margin:0;color:var(--text-2)}
.modal .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
body[data-nav="hidden"] .toasts{bottom:calc(env(safe-area-inset-bottom) + 16px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:4px;padding:6px 6px 6px 14px;font-size:13px;max-width:430px;box-shadow:0 6px 18px rgba(28,26,23,.18)}
.toast button{min-height:44px;padding:0 10px;color:var(--bg);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>

<script>
var App = (function () {

  /* ==== STATS: series numbers ==== */
  // Part E (spec §6). Pure: reads the series days, their trades and Claude's fill. Results in R, never dollars.
  // Days without a fill count as "unfilled"; no verdict before the last series day.
  var BASELINE = { winRate: 40, offPlan: '150/175', perDay: 20 }; // Aug–Sep 2026, from aug-sep-2026-trades.csv
  function seriesKeysFor(settings) {
    var se = settings.series, out = [];

    for (var i = 0; i < 1000 && out.length < se.days; i++) {
      if (settings.activeDays.indexOf(d.getDay()) >= 0) out.push(d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));

  function rateOf(list) {

    return { n: list.length, winRate: Math.round(wins.length / list.length * 100), avgR: sum(list) / list.length, avgWinR: wins.length ? sum(wins) / wins.length : null };
  }
  function statsFor(s, now) {

      urges += day && Array.isArray(day.urges) ? day.urges.length : 0;
      var f = day && isObj(day.filled) ? day.filled : null;

        if (!ft) return;

        var r = Number(ft.r);
        all.push({ key: k, r: isFinite(r) ? r : 0, hasR: isFinite(r), clean: ft.clean === true, box: ft.box, trigger: !!(ft.checks && ft.checks.trigger), early: !!at.earlyWindow });
        if (grid[ft.box] !== undefined) grid[ft.box]++;

    var conf = rateOf(withR.filter(function (t) { return t.trigger; }));

    return {
      day: sd ? Math.max(0, Math.min(sd.n, sd.of)) : 0, of: keys.length, final: !!sd && sd.n >= keys.length,
      trades: all.length, clean: all.filter(function (t) { return t.clean; }).length,

      streak: ss.streak, best: ss.best, total: ss.total, level: ss.level, badges: Object.keys(ss.badges),
      edge: conf, breakEven: { r2: 33, r15: 40 }, grid: grid, perDay: perDay, cap: s.settings.rules.tradeCap,
      calendar: calendar, urges: urges,

  /* ==== VIEW: stats + log ==== */

    var main = open.filter(function (it) { return pmd.later.indexOf(it.id) < 0; });
    var cur = null, curT = -1;
    main.forEach(function (it) {
      if (!it.time) return;
      var t = relMin(hmToMin(it.time), reset);
      if (t <= nr && t > curT) { cur = it; curT = t; }
    });
    if (!cur) cur = main[0] || null;

    }

  var UNDO_MS = 10000;
  function logTrade(outcome) {

    var rec = {

      enteredViaHold: !!day.entered, at: new Date().toISOString(),

    // v2 (spec §4): which setup, when it opened, and whether it opened inside the early window.

    var openMin = isFinite(openAt) ? (openAt - sessionWindow(c.key, c.s).start) / 60000 : null;

    rec.enteredAt = isFinite(openAt) ? day.enteredAt : null;

    rec.openOffsetMin = openMin === null ? null : Math.floor(openMin);

  // Undo of a just-logged outcome. Only the last trade, only within the toast window (+2s grace).
  function undoTrade(key, rec, before) {
    if (!state.days[key]) return;
    var day = getDay(key);
    var i = day.trades.indexOf(rec);
    if (i < 0 || i !== day.trades.length - 1 || Date.now() - Date.parse(rec.at) > UNDO_MS + 2000) { toast('Too late to undo'); return; }
    day.trades.splice(i, 1);
    var ac = state.activeCooldown;

    }

  /* ==== VIEW: cooldown ==== */
  var RING_C = 2 * Math.PI * 88;

    function go() {
      var ac = state.activeCooldown;
      if (ac) recordCooldown(ac, !ac.finished);
      var t = Date.now();
      state.activeCooldown = {
        presetId: p.id, name: p.name, seconds: p.seconds, startMsg: p.startMsg, endMsg: p.endMsg,
        steps: clone(p.steps), startedAt: t, endsAt: t + p.seconds * 1000, stepsDone: {}, trigger: trigger || 'manual', finished: false
      };
      logEvent('cooldown_start', trigger || 'manual');
      ui.cdSelected = p.id;
      ui.dayDone = false;
      saveNow();
      unlockAudio();
      requestWakeLock();
      // v2: the cooldown shows on the home screen; when the day is already done, on the Cooldown page.
      ui.tab = homeNow().state === 'cooldown' ? 'home' : 'cooldown';
      try { sessionStorage.setItem('checkpoint.tab', ui.tab); } catch (e) { /* ignore */ }
      render();
      window.scrollTo(0, 0);
    }
    var cur = state.activeCooldown;
    if (!(opts && opts.force) && cur && !cur.finished && cur.endsAt > Date.now()) {
      confirmModal('Replace the running cooldown?', cur.name + ' has ' + fmtMS((cur.endsAt - Date.now()) / 1000) + ' left. It will be recorded as ended early.', 'Replace', go, 'lock-o');
    } else go();
  }

  function moveEntry(kind, id, toListId, index) {

      } else {
        var from = cats.filter(function (c) { return c.items.some(function (x) { return x.id === id; }); })[0];
        if (!from) return;
        var it = from.items.splice(from.items.findIndex(function (x) { return x.id === id; }), 1)[0];
        var to = cats.filter(function (c) { return c.id === toListId; })[0] || from;

    for (var k = 0; k < cats.length; k++) {

      if (idx + dir >= 0 && idx + dir < cats[k].items.length) moveEntry(kind, id, cats[k].id, idx + dir);
      else if (dir < 0 && k > 0) moveEntry(kind, id, cats[k - 1].id, cats[k - 1].items.length);

  /* ==== DRAG: pointer reorder ==== */
  var drag = null;
  function dragStart(e, h) {
    if (e.button > 0) return;
    e.preventDefault();
    var kind = h.getAttribute('data-drag');
    var el = h.closest(kind === 'cat' ? '.dnd-cat' : '.dnd-row');
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var ph = document.createElement('div');
    ph.className = 'drop-ph';
    ph.style.height = Math.min(rect.height, kind === 'cat' ? 120 : rect.height) + 'px';
    ph.textContent = 'DROP HERE';
    el.parentNode.insertBefore(ph, el);
    el.style.width = rect.width + 'px';
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.classList.add('lifted');
    document.body.classList.add('dragging');
    drag = { kind: kind, id: h.getAttribute('data-id'), el: el, ph: ph, offY: e.clientY - rect.top, y: e.clientY, handle: h };
    ui.holding = true;
    try { h.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    h.addEventListener('pointermove', dragMove);
    h.addEventListener('pointerup', dragEnd);
    h.addEventListener('pointercancel', dragEnd);
    drag.raf = requestAnimationFrame(dragAutoScroll);
  }
  function dragMove(e) {
    if (!drag) return;
    drag.y = e.clientY;
    drag.el.style.top = (e.clientY - drag.offY) + 'px';
    dragPlace();
  }
  function dragPlace() {
    var y = drag.y, ph = drag.ph, el = drag.el;
    if (drag.kind === 'cat') {
      var box = el.parentNode;
      var sibs = $$('.dnd-cat', box).filter(function (x) { return x !== el; });
      var before = sibs.filter(function (x) { var r = x.getBoundingClientRect(); return y < r.top + Math.min(r.height, 120) / 2; })[0];
      if (before) box.insertBefore(ph, before); else box.appendChild(ph);
      return;
    }
    var lists = $$('.dnd-list', $('#view'));
    var best = null, bestD = Infinity;
    lists.forEach(function (l) {
      var card = l.closest('.dnd-cat') || l;
      var r = card.getBoundingClientRect();
      var d = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
      if (d < bestD) { bestD = d; best = l; }
    });
    if (!best) return;
    var rows = $$('.dnd-row', best).filter(function (x) { return x !== el && x.parentNode === best; });
    var bef = rows.filter(function (x) { var r = x.getBoundingClientRect(); return y < r.top + r.height / 2; })[0];
    if (bef) best.insertBefore(ph, bef); else best.appendChild(ph);
  }
  function dragAutoScroll() {
    if (!drag) return;
    var edge = 70, bottomEdge = window.innerHeight - (window.innerWidth >= 900 ? 70 : 130);
    var dy = 0;
    if (drag.y < edge) dy = -Math.ceil((edge - drag.y) / 5);
    else if (drag.y > bottomEdge) dy = Math.ceil((drag.y - bottomEdge) / 5);
    if (dy) { window.scrollBy(0, dy); dragPlace(); }
    drag.raf = requestAnimationFrame(dragAutoScroll);
  }
  function dragEnd() {
    if (!drag) return;

    d.handle.removeEventListener('pointermove', dragMove);
    d.handle.removeEventListener('pointerup', dragEnd);
    d.handle.removeEventListener('pointercancel', dragEnd);

    var parent = d.ph.parentNode;
    var index, listId = null;
    if (d.kind === 'cat') {
      index = $$('.dnd-cat, .drop-ph', parent).filter(function (x) { return x !== d.el && x.parentNode === parent; }).indexOf(d.ph);
    } else {
      listId = parent.getAttribute('data-list-id');

    moveEntry(d.kind, d.id, listId, index);

  /* ==== CHECK-INS ==== */
  // A check-in is due from its time for CHECKIN_WINDOW_MIN minutes on an active trading day, until answered.
  // Only the latest due one shows. Days closed with Red/Green Day show none.
  var CHECKIN_WINDOW_MIN = 60;
  var ANSWERS = {
    good: { label: 'Doing good' },
    notGood: { label: 'Not good', link: 'notGood', trigger: 'notGood' },
    redDay: { label: 'Red Day', link: 'redDay', trigger: 'redDay', close: 'red' },
    greenDay: { label: 'Green Day', link: 'greenDay', trigger: 'greenDay', close: 'green' }
  };
  function checkinTimes() {
    var reset = hmToMin(state.settings.resetHour);
    return state.settings.checkins.times.filter(function (t) { return /^\d{2}:\d{2}/.test(t.time || ''); })
      .slice().sort(function (a, b) { return relMin(hmToMin(a.time), reset) - relMin(hmToMin(b.time), reset); });
  }
  function checkinsActive() { return !!(device && device.checkinsHere); }
  // Pure: which scheduled check-in is due at `now` for this day record (or null).
  function dueCheckinFor(times, day, now, resetHour) {
    if (day && day.dayClosed) return null;
    var reset = hmToMin(resetHour);
    var n = relMin(minOfDay(now), reset);
    var cand = null;
    times.forEach(function (t) {
      var m = relMin(hmToMin(t.time), reset);
      if (m <= n && n - m < CHECKIN_WINDOW_MIN) cand = t;
    });
    if (!cand) return null;
    var answered = (day && day.checkins || []).some(function (r) { return r.checkinId === cand.id; });
    return answered ? null : cand;
  }
  function nextCheckinFor(times, day, now, resetHour) {
    var reset = hmToMin(resetHour);
    var n = relMin(minOfDay(now), reset);
    var done = (day && day.checkins || []).map(function (r) { return r.checkinId; });
    return times.filter(function (t) { return relMin(hmToMin(t.time), reset) > n && done.indexOf(t.id) < 0; })[0] || null;
  }
  // What the check-in UI should show now: { ci, manual } or null.
  function currentCheckin(now) {
    now = now || new Date();
    var key = todayKey(now);
    var day = state.days[key];
    if (ui.manualCheckin && ui.manualCheckin === key && !(day && day.dayClosed)) return { ci: null, manual: true };
    if (!checkinsActive() || !isActiveDay(key)) return null;
    var ci = dueCheckinFor(checkinTimes(), day, now, state.settings.resetHour);
    return ci ? { ci: ci, manual: false } : null;
  }
  function checkinLabel(cur) { return cur.manual ? 'CHECK-IN' : cur.ci.time + ' CHECK-IN'; }
  function checkinAnswers() {
    return '<div class="ci-answers">' +
      '<button type="button" class="a-good" data-act="ci-answer" data-a="good">Doing good</button>' +
      '<button type="button" class="a-notgood" data-act="ci-answer" data-a="notGood">Not good</button>' +
      '<button type="button" class="a-done" data-act="ci-answer" data-a="redDay">Done · Red Day</button>' +
      '<button type="button" class="a-done" data-act="ci-answer" data-a="greenDay">Done · Green Day</button></div>';
  }
  function checkinInner(cur) {
    var c = state.settings.checkins;
    return '<span class="ci-label">' + esc(checkinLabel(cur)) + '</span>' +
      (cur.ci && cur.ci.text ? '<p class="ci-text">' + esc(cur.ci.text) + '</p>' : '') +
      '<span class="ci-q">' + esc(c.question) + '</span>' + checkinAnswers() +
      '<span class="ci-foot">' + (cur.manual ? '<button type="button" class="textbtn" style="min-height:36px;padding:0" data-act="ci-cancel">Cancel</button>' : 'Stays lit until you answer.') + '</span>';
  }
  // The check-in card at the top of the Trade tab (main window).
  function checkinCard() {
    var cur = currentCheckin();
    return cur ? '<section class="ci-card" role="alert">' + checkinInner(cur) + '</section>' : '';
  }
  // A one-line banner on the other tabs.
  function checkinBanner() {
    var cur = currentCheckin();
    if (!cur || ui.tab === 'trade') return '';
    return '<div class="ci-banner" role="alert"><span>' + esc(checkinLabel(cur)) + ' · ' + esc(state.settings.checkins.question) + '</span>' +
      '<button type="button" class="btn accent-o" data-act="go-tab" data-tab="trade">ANSWER</button></div>';
  }
  function answerCheckin(answer) {
    var a = ANSWERS[answer];
    var cur = currentCheckin();
    if (!a || !cur) return;
    var key = todayKey();
    var day = getDay(key);
    var before = { dayClosed: day.dayClosed || null };
    var rec = {
      id: uid(), checkinId: cur.ci ? cur.ci.id : null, time: cur.ci ? cur.ci.time : fmtClock(new Date()),
      answer: answer, manual: !!cur.manual, at: new Date().toISOString(), device: devId()
    };
    day.checkins.push(rec);
    ui.manualCheckin = null;
    if (a.close) day.dayClosed = a.close;
    if (answer === 'good') ui.pipFlash = { msg: state.settings.checkins.goodMsg, until: Date.now() + 5000 };
    saveNow();
    undoOffer(a.label + ' logged', function () { undoCheckin(key, rec, before); });
    if (a.link) startCooldown(state.settings.presetLinks[a.link], a.trigger, { force: true });
    else { toast(state.settings.checkins.goodMsg); render(); }
  }
  function undoCheckin(key, rec, before) {
    if (!state.days[key]) return;
    var day = getDay(key);
    var i = day.checkins.indexOf(rec);
    if (i < 0 || Date.now() - Date.parse(rec.at) > UNDO_MS + 2000) { toast('Too late to undo'); return; }
    day.checkins.splice(i, 1);
    var trig = ANSWERS[rec.answer] && ANSWERS[rec.answer].trigger;
    var ac = state.activeCooldown;
    var cancelled = false;
    if (trig && ac && ac.trigger === trig && ac.startedAt >= Date.parse(rec.at)) {
      state.activeCooldown = null;
      releaseWakeLock();
      cancelled = true;
    }
    day.dayClosed = before.dayClosed;
    day.undone.push({ id: uid(), kind: 'checkin', answer: rec.answer, loggedAt: rec.at, undoneAt: new Date().toISOString(), cooldownCancelled: cancelled, device: devId() });
    if (rec.manual) ui.manualCheckin = key;
    ui.pipUndo = null;
    ui.pipFlash = null;
    saveNow();
    ui.tab = 'trade';
    try { sessionStorage.setItem('checkpoint.tab', 'trade'); } catch (e) { /* ignore */ }
    render();
    toast('Undone · ' + ANSWERS[rec.answer].label + ' removed' + (cancelled ? ' · cooldown cancelled' : ''));
  }
  // Undo offer shown both as a toast (main window) and as a bar in the floating window.
  function undoOffer(msg, fn) {
    var done = false;
    function once() { if (done) return; done = true; ui.pipUndo = null; fn(); }
    ui.pipUndo = { msg: msg, fn: once, until: Date.now() + UNDO_MS };

  // Called every tick: chime once when a check-in becomes due, re-render when it appears or goes.
  function checkinTick() {
    var cur = currentCheckin();
    var sig = cur ? todayKey() + '|' + (cur.ci ? cur.ci.id : 'manual') : '';
    if (sig === ui.ciSig) return;
    var fresh = sig && cur.ci && !ui.ciRung[sig];
    ui.ciSig = sig;
    if (fresh) { ui.ciRung[sig] = true; chime(); vibrate([200, 100, 200]); }
    if (!ui.holding && !drag && ui.tab !== 'settings') render(); else pipRender();
  }

  /* ==== FLOAT: floating window ==== */
  // Chrome/Edge Document Picture-in-Picture: a small always-on-top window, same app, same data.
  var pip = { win: null, sig: '' };
  function floatButton() {

  function attachPip(w) {

  function pipMode() {
    var now = new Date();

    if (ui.pipFlash && ui.pipFlash.until > Date.now()) return 'flash';

  function sessionFill(now) {
    var w = sessionWindow(todayKey(now), state.settings);
    if (w.end <= w.start) return 0;
    return Math.max(0, Math.min(1, (now.getTime() - w.start) / (w.end - w.start)));
  }
  var PR = 2 * Math.PI * 48;
  function pipView(mode) {
    var now = new Date();
    var c = tradeCtx(now);
    var s = state.settings;
    var cls = mode === 'checkin' ? ' lit' : (mode === 'cooldown' ? ' cool' : '');

  /* ==== HOLD: press-and-hold buttons ==== */
  function bindHolds(root) { $$('[data-hold]', root).forEach(bindHold); }
  function bindHold(btn) {
    var sec = Math.max(0.2, +btn.getAttribute('data-sec') || 1);
    var label = btn.querySelector('.hold-label');
    var base = label ? label.textContent : '';
    var start = 0, raf = 0, fired = false;
    // Use the button's own window: the floating window keeps animating while the main window is covered.
    var W = (btn.ownerDocument && btn.ownerDocument.defaultView) || window;
    function frame() {
      var p = Math.min(1, (performance.now() - start) / (sec * 1000));
      btn.style.setProperty('--fill', p);
      if (label) label.textContent = 'HOLD · ' + (sec * (1 - p)).toFixed(1) + 'S';
      if (p >= 1) {
        fired = true;
        stop();
        onHoldComplete(btn.getAttribute('data-hold'));
        return;
      }
      raf = W.requestAnimationFrame(frame);
    }
    function down(e) {
      if (btn.disabled || start) return;
      if (e && e.preventDefault) e.preventDefault();
      if (e && e.pointerId != null) { try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
      unlockAudio();
      fired = false;
      start = performance.now();
      ui.holding = true;
      raf = W.requestAnimationFrame(frame);
    }
    function stop() {
      if (!start) return;
      W.cancelAnimationFrame(raf);
      start = 0;
      ui.holding = false;
      if (!fired) {
        btn.style.setProperty('--fill', 0);
        if (label) label.textContent = base;
      }
    }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('lostpointercapture', stop);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    btn.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) down(e); });
    btn.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') stop(); });
    btn.addEventListener('blur', stop);
  }
  function onHoldComplete(kind) {
    var key = todayKey();
    if (kind === 'enter') {
      var dd = getDay(key);
      dd.entered = true;
      dd.enteredAt = new Date().toISOString();
      dd.enteredSetup = (dd.looking && dd.looking.setupId) || null;
      dd.looking = null;
      logEvent('enter', dd.enteredSetup);
      vibrate(60);
      save();
      render();
    } else if (kind === 'urge') {
      getDay(key).urges.push({ id: uid(), at: new Date().toISOString(), device: devId() });
      logEvent('urge');
      vibrate(60);
      save();
      startCooldown(state.settings.presetLinks.urge, 'urge');
    } else if (kind === 'urgeNote') {
      // v2 home: "felt the urge, didn't act". Logged only; no cooldown (it would cover the In-trade screen).
      var du = getDay(key);
      du.urges.push({ id: uid(), at: new Date().toISOString(), device: devId(), resisted: true });
      logEvent('urge', 'resisted');
      vibrate(60);
      save();
      render();
      toast('Urge resisted · ' + du.urges.length + ' today');
    } else if (kind === 'endEarly') {
      var ac = state.activeCooldown;
      if (ac) {
        recordCooldown(ac, true);
        state.activeCooldown = null;
        releaseWakeLock();

  }

  function lockedBySession() {

    openModal({ title: 'Available after the session', html: '<p>Replace, reset, clear and erase are off while the session is live, so the record and cap for today stay as they are. Merge still works.</p>', actions: [{ label: 'OK', cls: 'ghost' }] });

  function validImport(obj) {
    return isObj(obj) && obj.schema != null && isObj(obj.checklists);

  // Adds categories, items, presets and days whose ids don't exist locally. Returns counts.
  function mergeImport(local, inc) {
    var n = { categories: 0, items: 0, presets: 0, days: 0 };
    ['premarket', 'trade', 'sessionOver'].forEach(function (l) {
      var incL = inc.checklists[l];
      if (!incL || !Array.isArray(incL.categories)) return;
      var locCats = local.checklists[l].categories;
      var have = {};
      locCats.forEach(function (c) { c.items.forEach(function (i) { have[i.id] = true; }); });
      incL.categories.forEach(function (ic) {
        if (!ic || !ic.id || !Array.isArray(ic.items)) return;
        var lc = locCats.filter(function (c) { return c.id === ic.id; })[0];
        if (!lc) {
          var fresh = clone(ic);
          fresh.items = fresh.items.filter(function (i) { return i && i.id && !have[i.id]; });
          fresh.items.forEach(function (i) { have[i.id] = true; });
          locCats.push(fresh);
          n.categories++;
          n.items += fresh.items.length;
          return;
        }
        ic.items.forEach(function (ii, idx) {
          if (!ii || !ii.id || have[ii.id]) return;
          var pos = 0;
          for (var k = idx - 1; k >= 0; k--) {
            var prevId = ic.items[k] && ic.items[k].id;
            var at = lc.items.findIndex(function (x) { return x.id === prevId; });
            if (at >= 0) { pos = at + 1; break; }
          }
          lc.items.splice(pos, 0, clone(ii));
          have[ii.id] = true;
          n.items++;
        });
      });
    });
    if (Array.isArray(inc.presets)) {
      inc.presets.forEach(function (p) {
        if (!p || !p.id || findPresetIn(local, p.id)) return;
        local.presets.push(clone(p));
        n.presets++;
      });
    }
    if (isObj(inc.days)) {
      Object.keys(inc.days).forEach(function (k) {
        if (local.days[k]) return;
        local.days[k] = clone(inc.days[k]);
        n.days++;
      });
    }
    return n;
  }
  function summary(n) {
    var parts = [];
    function add(v, one, many) { if (v) parts.push('Added ' + v + ' ' + (v === 1 ? one : many)); }
    add(n.categories, 'category', 'categories');
    add(n.items, 'item', 'items');
    add(n.presets, 'preset', 'presets');
    add(n.days, 'day', 'days');
    return parts.length ? parts.join(', ').replace(/, Added/g, ',') + '.' : 'Nothing new to add. Everything was already here.';
  }

  function bindEvents() {
    $$('.tab').forEach(function (t) { t.addEventListener('click', function () { setTab(t.getAttribute('data-tab')); }); });
    var view = $('#view');
    view.addEventListener('click', function (e) {
      // v2 Part C: a tap outside the open roll-up row closes it (and the tap still does what it does).
      if (ui.ruOpen && !e.target.closest('.ru-open') && !e.target.closest('[data-act="ru"]')) {
        ui.ruOpen = null;
        if (!e.target.closest('[data-act]')) { render(); return; }
      }
      var el = e.target.closest('[data-act]');
      if (!el || !view.contains(el) || el.disabled) return;
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (fn) fn(el, e);
    });
    view.addEventListener('change', function (e) {
      var el = e.target.closest('[data-change]');
      if (!el) return;
      var fn = CHANGES[el.getAttribute('data-change')];
      if (fn) fn(el, e);
    });
    view.addEventListener('pointerdown', function (e) {
      var h = e.target.closest('[data-drag]');
      if (h && view.contains(h)) dragStart(e, h);
    });
    view.addEventListener('keydown', function (e) {
      var h = e.target.closest && e.target.closest('[data-drag]');
      if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      moveByKey(h.getAttribute('data-drag'), h.getAttribute('data-id'), e.key === 'ArrowUp' ? -1 : 1);
    });
    $('#import-file').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) handleImportFile(f);
    });
    $('#import-filled').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) handleFilledFile(f);
    });
    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { flushSave(); return; }
      onResume();
    });
    window.addEventListener('focus', onResume);
    window.addEventListener('pagehide', flushSave);
    window.addEventListener('storage', function (e) {
      if (e.key !== KEY || !e.newValue) return;
      try { state = normalise(JSON.parse(e.newValue)); applyTheme(); render(); } catch (err) { /* ignore */ }
    });
  }
  function onResume() {
    applyDuePending();
    if (finishCooldownIfDue()) { render(); return; }
    tickCooldownDom();
    requestWakeLock();
    if (!ui.holding && ui.tab !== 'settings') render();
  }

  /* ==== PWA: service worker ==== */
  function registerSW() {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
    function offer(worker) {
      toast('Update available', { label: 'Reload', fn: function () { worker.postMessage('SKIP_WAITING'); } }, 0);
    }
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w);
        });
      });
      setInterval(function () { reg.update().catch(function () { /* offline */ }); }, 60 * 60 * 1000);
    }).catch(function () { /* ignore */ });
  }

  /* ==== BOOT ==== */
  var lastSlow = 0;
  function tick() {
    if (finishCooldownIfDue()) { if (!ui.holding) render(); return; }
    tickCooldownDom();
    checkinTick();
    // v2 home: re-render when the day moves to another state (or the early window ends); else update in place.
    var hs = homeNow();
    if (homeSig(hs) !== ui.homeSig && !ui.holding && !drag) {
      if (ui.tab === 'home' || homeLocked(hs.state)) render();
      else { ui.homeSig = homeSig(hs); applyChrome(); }
    }
    tickHomeDom();
    pipRender();
    var t = Date.now();
    if (t - lastSlow >= 20000) {
      lastSlow = t;
      applyTheme();
      var applied = applyDuePending();
      if (!ui.holding && !drag && (ui.tab !== 'settings' || (applied && !ui.editor))) render();
    }
  }
  function init() {
    loadDevice();
    load();
    initStamps();
    applyDuePending();
    applyTheme();
    bindEvents();
    finishCooldownIfDue();
    render();
    if (loadNotice) toast(loadNotice, null, 0);
    if (navigator.storage && navigator.storage.persist) {
      try {
        navigator.storage.persisted().then(function (p) { if (!p) return navigator.storage.persist(); }).catch(function () { /* ignore */ });
      } catch (e) { /* ignore */ }
    }
    requestWakeLock();
    lastSlow = Date.now();
    setInterval(tick, 250);
    registerSW();
  }

  var api = {
    init: init,
    makeDefaults: makeDefaults,
    tradingDayKey: tradingDayKey,
    sessionPhase: sessionPhase,
    isLoosening: isLoosening,
    mergeImport: mergeImport,
    checkpointKeys: checkpointKeys,
    dueCheckinFor: dueCheckinFor,
    nextCheckinFor: nextCheckinFor,
    migrateDayRecords: migrateDayRecords,
    attachPip: attachPip,
    get device() { return device; },
    escapeHTML: escapeHTML,
    fillMissing: fillMissing,
    themeFor: themeFor,
    // v2 Part B
    normalise: normalise,
    sessionWindow: sessionWindow,
    sessionTimesFor: sessionTimesFor,
    homeStateFor: homeStateFor,
    doneReasonFor: doneReasonFor,
    isEarlyFor: isEarlyFor,
    setupRowsFor: setupRowsFor,
    seriesDayFor: seriesDayFor,
    wordIndex: wordIndex,
    // v2 Part C
    carryToday: carryToday,
    cardFor: cardFor,
    rollupsFor: rollupsFor,
    rowOfCat: rowOfCat,
    itemsOfRow: itemsOfRow,
    pasteSplit: pasteSplit,
    // v2 Part D
    exportTodayFor: exportTodayFor,
    validFilled: validFilled,
    mergeFilled: mergeFilled,
    pointsFor: pointsFor,
    seriesStatsFor: seriesStatsFor,
    dayBadgesFor: dayBadgesFor,
    levelFor: levelFor,
    isoLocal: isoLocal,
    // v2 Part E
    statsFor: statsFor,
    seriesKeysFor: seriesKeysFor,
    eventLabel: eventLabel,
    WORD_LOOP: WORD_LOOP,
    HOME_STATES: HOME_STATES,
    homeNow: function () { return homeNow(); },
    go: function (tab) { setTab(tab); },
    get state() { return state; },
    ui: ui
  };
  return api;
})();

if (typeof document !== 'undefined' && document.getElementById('view')) App.init();
</script>
</body>
</html>
