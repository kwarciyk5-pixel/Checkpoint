<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkpoint</title>
<meta name="description" content="Trading-discipline checklists, trade locks and cooldowns.">
<meta name="theme-color" content="#0B0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checkpoint">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ==== STYLE: tokens ==== */
:root{
  --bg:#0B0D10; --surface:#12171B; --surface-2:#0F1316; --line:#2A3139; --line-soft:#1E242A;
  --text:#E8ECEF; --text-2:#B4BCC5; --muted:#8B95A1; --dim:#5E6873;
  --accent:#4DF0B0; --accent-a:rgba(77,240,176,.10); --accent-b:rgba(77,240,176,.35);
  --lock:#FFB547; --lock-a:rgba(255,181,71,.10);
  --info:#6FB8FF; --info-a:rgba(111,184,255,.10);
  --danger-soft:#FF8A7A;
  --radius:10px;
  --f-head:"Chakra Petch", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --tabh:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:var(--f-head);font-size:16px;line-height:1.4;min-height:100vh;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:700;letter-spacing:.01em}
h1{font-size:26px}
h2{font-size:18px;font-weight:600}
.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.accent{color:var(--accent)}
.amber{color:var(--lock)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ==== STYLE: layout + tabs ==== */
#view{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .brand{display:none}
.tab{flex:1;min-height:var(--tabh);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);border-top:2px solid transparent;margin-top:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
@media (min-width:900px){
  .tabs{top:0;bottom:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:28px 12px;gap:4px}
  .tabs .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:18px;letter-spacing:.06em;padding:0 14px 20px}
  .tabs .brand img{width:26px;height:26px;border-radius:6px}
  .tab{flex:0 0 auto;min-height:48px;text-align:left;padding:0 14px;border-top:0;margin-top:0;border-left:2px solid transparent;font-size:12px}
  .tab[aria-selected="true"]{border-left-color:var(--accent);background:var(--accent-a)}
  #view{margin-left:220px;padding:32px 24px 48px}
}

/* ==== STYLE: components ==== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.accent-card{border-color:var(--accent);box-shadow:0 0 14px var(--accent-a)}
.card.lock-card{border-color:var(--lock);background:linear-gradient(0deg,var(--lock-a),var(--lock-a)),var(--surface)}
.card.info-card{border-color:var(--info);background:linear-gradient(0deg,var(--info-a),var(--info-a)),var(--surface)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.accent-o{border-color:var(--accent);color:var(--accent)}
.btn.lock-o{border-color:var(--lock);color:var(--lock)}
.btn.danger-o{border-color:var(--line);color:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.textbtn{min-height:44px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:18px}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-a)}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.amber{border-color:var(--lock);color:var(--lock)}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:4px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);box-shadow:0 0 8px var(--accent);border-radius:4px;transition:width .3s ease}
.banner{border-radius:var(--radius);padding:12px 14px;border:1px solid var(--info);background:var(--info-a);color:var(--text);font-size:14px}
.banner .mono{color:var(--info);display:block;margin-bottom:2px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cb{width:22px;height:22px;flex:none;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.cb svg{width:14px;height:14px;opacity:0}
.cb.dashed{border-style:dashed}
[aria-pressed="true"] > .cb, .cb.on{background:var(--accent);border-color:var(--accent)}
[aria-pressed="true"] > .cb svg, .cb.on svg{opacity:1}

/* ==== STYLE: premarket ==== */
.page-head{display:flex;flex-direction:column;gap:10px;padding:4px 0 4px}
.now-strip .now-text{font-size:21px;font-weight:600;margin:6px 0 2px}
.now-strip .note{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.big-done{min-height:56px;width:100%;margin-top:12px;font-size:15px}
.next-line{margin-top:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.cat{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.cat-head{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.cat-head .chev{display:inline-block;transition:transform .2s;color:var(--dim);margin-right:8px}
.cat-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cat-body{border-top:1px solid var(--line-soft);padding:8px;display:flex;flex-direction:column;gap:6px}
.item{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line-soft);border-radius:8px;background:var(--surface-2)}
.item[aria-pressed="true"]{border-color:var(--accent)}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:500;display:block}
.item .txt small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.item .time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item.optional{opacity:.55}
.item.gate{cursor:default}
.gate-btns{display:flex;gap:6px;flex:none}
.gate-btns button{min-width:48px;min-height:40px;border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.gate-btns button[aria-pressed="true"].yes{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.gate-btns button[aria-pressed="true"].no{border-color:var(--info);color:var(--info);background:var(--info-a)}
.focus-wrap{min-height:calc(100vh - 160px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:12px 0}
.focus-item{font-size:38px;line-height:1.15;font-weight:700}
.focus-note{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.focus-done{min-height:68px;font-size:18px}

/* ==== STYLE: trade ==== */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rules .cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.rules .cell b{display:block;font-family:var(--f-mono);font-size:16px;font-weight:600;margin-top:4px;letter-spacing:.04em}
.session-bar{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--info);border-radius:var(--radius);background:var(--info-a);color:var(--info);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}
.counter{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.counter h2{font-family:var(--f-mono);font-size:22px;letter-spacing:.08em}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:10px;height:10px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2)}
.pip.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px var(--accent)}
.enter{position:relative;width:100%;min-height:64px;border-radius:var(--radius);overflow:hidden;font-family:var(--f-mono);font-size:15px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px}
.enter.off{border:1.5px dashed var(--line);color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:none;font-family:var(--f-mono)}
.enter.live{border:1px solid var(--accent);color:var(--bg);background:var(--accent);font-weight:600}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold::before{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--fill,0));background:currentColor;opacity:.22;pointer-events:none}
.enter.live.hold::before{background:var(--bg);opacity:.3}
.hold > span{position:relative}
.outcomes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.outcomes .btn{padding:0 4px}
.urge{width:100%;min-height:56px;border:1px solid var(--lock);color:var(--lock);border-radius:var(--radius);font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px}
.lock-title{font-size:20px;font-weight:700;margin:4px 0 6px}
.done-screen{text-align:center;padding:36px 18px}
.done-screen h1{font-size:30px;margin:10px 0 18px}
details.log-anyway summary{min-height:44px;display:flex;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
details.log-anyway summary::-webkit-details-marker{display:none}
.sub-head{display:flex;justify-content:space-between;align-items:center;margin-top:4px}

/* ==== STYLE: cooldown ==== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);background:var(--surface)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-a)}
.chip.running[aria-pressed="true"]{border-color:var(--lock);color:var(--lock);background:var(--lock-a)}
.ring-wrap{position:relative;width:min(240px,70vw);aspect-ratio:1;margin:8px auto}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-wrap .big{font-family:var(--f-mono);font-size:48px;font-weight:600;letter-spacing:.02em}
.steps{display:flex;flex-direction:column;gap:6px}
.step.current{border-color:var(--accent)}
.msg{font-size:17px;line-height:1.45}

/* ==== STYLE: settings + editors ==== */
.sec-title{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:14px 2px 2px}
.list-row{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:0}
.list-row small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.list-card{padding:0}
.field{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.field:last-child{border-bottom:0}
.field > label, .field > .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.field .hint{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;min-height:44px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px}
input[type=number],input[type=time]{font-family:var(--f-mono)}
textarea{min-height:76px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
.num-sm{max-width:110px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:48px;height:44px;font-size:20px;color:var(--text-2)}
.stepper output{min-width:44px;text-align:center;font-family:var(--f-mono);font-size:16px}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--accent-a);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--accent)}
.switch-row{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-chips{display:flex;gap:6px;flex-wrap:wrap}
.day-chips button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.day-chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-a)}
.swatches{display:flex;gap:10px}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.swatch i{width:24px;height:24px;border-radius:50%;display:block}
.swatch[aria-pressed="true"]{border-color:var(--text)}
.pending{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--lock);border-radius:8px;padding:4px 4px 4px 10px;color:var(--lock);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;background:var(--lock-a);margin-top:6px}
.pending button{min-height:36px;padding:0 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--text-2);border:1px solid var(--line);border-radius:6px}
.editor-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.editor-head h1{flex:1;font-size:21px}
.saved{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent);opacity:0;transition:opacity .3s}
.saved.on{opacity:1;transition:none}
.handle{width:40px;height:44px;flex:none;display:grid;place-items:center;color:var(--dim);font-size:20px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dnd-cats{display:flex;flex-direction:column;gap:12px}
.ecat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px}
.ecat-bar{display:flex;align-items:center;gap:4px}
.ecat-bar input{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
.dnd-list{display:flex;flex-direction:column;gap:6px;padding:6px 0;min-height:14px}
.eitem{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px}
.erow{display:flex;align-items:center;gap:2px}
.etext{flex:1;min-width:0;min-height:44px;text-align:left;padding:6px 4px;display:flex;align-items:center;gap:8px}
.etext .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.etext .t.empty{color:var(--dim)}
.etext .flags{display:flex;gap:4px;flex-wrap:wrap}
.eexp{padding:4px 10px 12px 12px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line-soft)}
.add-btn{min-height:44px;width:100%;border:1px dashed var(--line);border-radius:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--muted)}
.lifted{position:fixed !important;z-index:50;border-color:var(--accent) !important;box-shadow:0 12px 32px rgba(0,0,0,.6),0 0 0 1px var(--accent);transform:rotate(1.2deg);pointer-events:none;margin:0 !important}
.drop-ph{border:1.5px dashed var(--accent);border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);background:var(--accent-a);min-height:44px}
body.dragging{user-select:none;-webkit-user-select:none}

/* ==== STYLE: modal + toast ==== */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(5,6,8,.75);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){.modal-back{align-items:center}}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.modal p{margin:0;color:var(--text-2)}
.modal .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 12px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media (min-width:900px){.toasts{left:220px;bottom:24px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:520px}
.toast button{min-height:36px;padding:0 10px;color:var(--accent);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
  .bar>i,.pip.on,.card.accent-card{box-shadow:none}
}
</style>
</head>
<body>
<div id="app">
  <nav class="tabs" role="tablist" aria-label="Sections">
    <div class="brand"><img src="icons/icon-192.png" alt="">CHECKPOINT</div>
    <button class="tab" role="tab" data-tab="premarket" aria-selected="true">PREMARKET</button>
    <button class="tab" role="tab" data-tab="trade" aria-selected="false">TRADE</button>
    <button class="tab" role="tab" data-tab="cooldown" aria-selected="false">COOLDOWN</button>

<script>
var App = (function () {
  'use strict';

  /* ==== CORE: helpers ==== */
  var KEY = 'checkpoint.v1';
  var ACCENTS = { mint: [77, 240, 176], blue: [111, 184, 255], violet: [199, 155, 255] };
  var DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#0B0D10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function uid() {
    try {

  function escapeHTML(s) {

  }

  }
  function fmtClock(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  }
  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  /* ==== DEFAULTS: prefilled content ==== */
  function makeDefaults() {

    function pm(text, note, time, flags) {

    }
    function tr(text, note, afterStopOnly) { return { id: uid(), text: text, note: note || '', afterStopOnly: !!afterStopOnly }; }
    function so(text) { return { id: uid(), text: text, note: '' }; }
    function preset(name, seconds, steps, startMsg, endMsg) {

    }

      preset('After SL', 300, ['Stand up', '3 physiological sighs', 'Leave the desk', 'Water'],

      preset('Urge', 90, ['Breathe in 4, out 6', 'Stand up'],
        'Hands off the mouse. Breathe.',

        'Have you cooled down? Don\'t forget that our goal is to stay in the game long enough to win. Trade today so that you can trade tomorrow.'),
      preset('Green Day', 60, ['Close the platform', 'Write your journal'],

        'Remember, small compounding wins.')
    ];
    return {
      schema: 1,
      settings: {
        accent: 'mint',
        resetHour: '06:00',
        activeDays: [1, 2, 3, 4, 5],
        session: { start: '20:30', end: '21:40' },
        rules: { tradeCap: 2, maxDailyLoss: 600, maxRiskPerTrade: 300, notATradeMsg: 'Not a trade. Arm every check first.' },
        behaviour: {

        presetLinks: { sl: presets[0].id, urge: presets[2].id, redDay: presets[3].id, greenDay: presets[4].id, notGood: presets[1].id },
        sound: true, vibration: false, focusMode: false,

        lastExportAt: null
      },
      checklists: {
        premarket: {
          categories: [
            cat('BODY', [
              pm('Slept enough', '', '', 'gate'),
              pm('Rested / nap', 'Finish what you\'re doing, short nap if you want', '18:50'),
              pm('Physically OK', 'Not depleted or unwell', '', 'gate'),
              pm('Concentration OK', '', '', 'gate'),
              pm('Stress manageable', '', '', 'gate')
            ]),
            cat('DAYTIME', [
              pm('Dump to Claude', 'MQ newsletter · Paralia newsletter · 1BB brief · Daily Structural levels · MQ levels'),
              pm('Watch MQ videos', '', '', 'optional'),
              pm('Read 1BB brief')
            ]),
            cat('DESK', [
              pm('Prepare zones in chart', '', '19:30'),
              pm('Trade plan for the day'),
              pm('ATAS ready'),
              pm('1BB screenshot', 'Dashboard + Engine', '20:00'),
              pm('OVN screenshot')
            ]),
            cat('LOCKS', [
              pm('Check account settings'),
              pm('Copier on'),
              pm('Platform daily loss −$600, auto-flatten ON'),
              pm('Max order size = planned contracts'),
              pm('Every copy-group account has more than $600 left before its drawdown limit'),
              pm('Pyae knows today\'s plan and cap'),
              pm('After-session exit decided', 'Gym, leave the room')
            ]),
            cat('DATA', [
              pm('Premarket fetches in → build data', '', '20:12'),
              pm('Drink water', '', '20:20'),
              pm('Post-open fetch', '', '20:45')
            ])
          ]
        },
        trade: {
          categories: [
            cat('BEFORE ENTRY', [
              tr('Level is on today\'s plan', 'Not in do-nothing zone · no event window'),
              tr('Trigger confirmed on footprint/TAS', 'Confirmed, not anticipated'),
              tr('Size = plan · stop covers the level', 'Risk within today\'s limit'),
              tr('Reward to risk ≥ 1:3', 'To a planned target'),
              tr('New trigger at a different level · cooldown done · why and how said to Pyae', '', true)
            ])
          ]
        },
        sessionOver: {
          categories: [
            cat('CLOSE OUT', [so('Platform closed'), so('No other accounts'), so('Left the room'), so('Eyes off all charts')])
          ]
        }
      },
      presets: presets,
      pending: [],
      days: {},
      activeCooldown: null
    };
  }

  function newDay() {
    return {
      premarket: { checked: {}, gateNo: {}, later: [], collapsed: {} },
      tradeChecks: {},
      entered: false,
      trades: [],
      cooldowns: [],
      urges: [],
      sessionOver: { checked: {} },
      dayDoneShown: false
    };
  }

  /* ==== TIME: trading day + session ==== */
  function tradingDayKey(date, resetHour) {
    var d = new Date(date.getTime());
    if (minOfDay(d) < hmToMin(resetHour)) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function keyToDate(key) {
    var p = key.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0);
  }
  function fmtDayKey(key) {
    var d = keyToDate(key);
    return DOW[d.getDay()] + ' ' + pad2(d.getDate()) + ' ' + MON[d.getMonth()];
  }
  function todayKey(now) { return tradingDayKey(now || new Date(), state.settings.resetHour); }
  function isActiveDayFor(key, settings) { return settings.activeDays.indexOf(keyToDate(key).getDay()) >= 0; }
  function isActiveDay(key) { return isActiveDayFor(key, state.settings); }
  // Phase of the session relative to the trading day: before | live | after
  function sessionPhase(date, settings) {
    var reset = hmToMin(settings.resetHour);
    var n = relMin(minOfDay(date), reset);
    var s = relMin(hmToMin(settings.session.start), reset);
    var e = relMin(hmToMin(settings.session.end), reset);
    if (e <= s) return n < s ? 'before' : 'after';
    if (n < s) return 'before';
    if (n < e) return 'live';
    return 'after';
  }
  function sessionInfo(now) {
    now = now || new Date();
    var s = state.settings;
    var key = todayKey(now);
    if (!isActiveDay(key)) return { phase: 'off', right: 'NO SESSION TODAY' };
    var phase = sessionPhase(now, s);
    var reset = hmToMin(s.resetHour);
    var n = relMin(minOfDay(now), reset);
    if (phase === 'before') return { phase: phase, right: 'STARTS IN ' + fmtDur(relMin(hmToMin(s.session.start), reset) - n) };
    if (phase === 'live') return { phase: phase, right: (relMin(hmToMin(s.session.end), reset) - n) + ' MIN LEFT' };
    return { phase: phase, right: 'SESSION OVER' };
  }
  function sessionLive(now) {
    now = now || new Date();
    return isActiveDay(todayKey(now)) && sessionPhase(now, state.settings) === 'live';
  }

  /* ==== STATE: load/save ==== */
  var state = null;
  var saveTimer = null;
  var loadNotice = null;

  function fillMissing(target, defs) {
    Object.keys(defs).forEach(function (k) {
      if (!(k in target) || target[k] === undefined) target[k] = clone(defs[k]);
      else if (isObj(defs[k]) && !isObj(target[k])) target[k] = clone(defs[k]);
      else if (isObj(defs[k]) && isObj(target[k])) fillMissing(target[k], defs[k]);
    });
    return target;
  }
  function normalise(s) {
    var defs = makeDefaults();
    fillMissing(s, defs);
    if (!Array.isArray(s.presets) || !s.presets.length) s.presets = defs.presets;
    Object.keys(s.settings.presetLinks).forEach(function (k) {
      if (!findPresetIn(s, s.settings.presetLinks[k])) s.settings.presetLinks[k] = s.presets[0].id;
    });
    ['premarket', 'trade', 'sessionOver'].forEach(function (l) {
      if (!Array.isArray(s.checklists[l].categories)) s.checklists[l].categories = [];
    });
    if (!Array.isArray(s.pending)) s.pending = [];
    if (!isObj(s.days)) s.days = {};
    return s;
  }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) { state = makeDefaults(); saveNow(); return; }
    try {
      var parsed = JSON.parse(raw);
      if (!isObj(parsed)) throw new Error('not an object');
      state = normalise(parsed);
    } catch (e) {
      try { localStorage.setItem(KEY + '.corrupt-' + Date.now(), raw); } catch (e2) { /* ignore */ }
      state = makeDefaults();
      loadNotice = 'Saved data could not be read. A copy was kept and the defaults were loaded.';
      saveNow();
    }
  }
  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Could not save. Storage may be full.'); }
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
  }
  function flushSave() { if (saveTimer) saveNow(); }
  function getDay(key) {
    if (!state.days[key]) state.days[key] = newDay();
    return fillMissing(state.days[key], newDay());
  }
  function findPresetIn(s, id) {
    for (var i = 0; i < s.presets.length; i++) if (s.presets[i].id === id) return s.presets[i];
    return null;
  }
  function findPreset(id) { return findPresetIn(state, id); }
  function findItem(list, id) {
    var cats = state.checklists[list].categories;
    for (var i = 0; i < cats.length; i++) {
      for (var j = 0; j < cats[i].items.length; j++) if (cats[i].items[j].id === id) return cats[i].items[j];
    }
    return null;
  }
  function findCat(list, id) {
    return state.checklists[list].categories.filter(function (c) { return c.id === id; })[0] || null;
  }

  /* ==== RULES: loosening + pending ==== */
  var LOOSEN = {
    'rules.tradeCap': 'up', 'rules.maxDailyLoss': 'up', 'rules.maxRiskPerTrade': 'up',
    'behaviour.slStartsCooldown': 'off', 'behaviour.dayDoneAfterTP': 'off',
    'behaviour.lockAtCap': 'off', 'behaviour.lockDuringCooldown': 'off',
    'behaviour.holdToEnterSec': 'down', 'behaviour.endEarlyHoldSec': 'down', 'behaviour.urgeHoldSec': 'down',
    'preset.seconds': 'down', 'preset.stepDelete': 'always',
    'trade.itemAdd': 'never', 'trade.itemDelete': 'always', 'trade.itemEdit': 'always',
    'trade.afterStopOnly': 'on', 'trade.categoryDelete': 'always',
    'session': 'change', 'activeDays': 'change', 'presetLinks': 'change'
  };
  function isLoosening(ch) {
    switch (LOOSEN[ch.key]) {
      case 'up': return Number(ch.to) > Number(ch.from);
      case 'down': return Number(ch.to) < Number(ch.from);
      case 'off': return !!ch.from && !ch.to;
      case 'on': return !ch.from && !!ch.to;
      case 'always': return true;
      case 'change': return !sameVal(ch.from, ch.to);
      default: return false;
    }
  }
  function pendingFor(key) { return state.pending.filter(function (p) { return p.key === key; })[0] || null; }
  function removePending(key) { state.pending = state.pending.filter(function (p) { return p.key !== key; }); }
  // Value a control should step from: the pending target if one exists, else the live value.
  function targetValue(key, live) {
    var p = pendingFor(key);
    return p && p.apply.op === 'set' ? clone(p.apply.value) : live;
  }
  function applyOp(op) {
    var cats, p;
    if (op.op === 'set') setPath(state, op.path, clone(op.value));
    else if (op.op === 'deleteItem') {
      state.checklists[op.list].categories.forEach(function (c) {
        c.items = c.items.filter(function (i) { return i.id !== op.itemId; });
      });
    } else if (op.op === 'editItem') {
      var it = findItem(op.list, op.itemId);
      if (it) it[op.field] = op.value;
    } else if (op.op === 'deleteCategory') {
      cats = state.checklists[op.list];
      cats.categories = cats.categories.filter(function (c) { return c.id !== op.catId; });
    } else if (op.op === 'presetSet') {
      p = findPreset(op.presetId);
      if (p) p[op.field] = op.value;
    } else if (op.op === 'deleteStep') {
      p = findPreset(op.presetId);
      if (p) p.steps = p.steps.filter(function (s) { return s.id !== op.stepId; });
    }
  }
  // o: { key, rule, from, to, op, label?, fromText?, toText? } -> 'noop' | 'pending' | 'applied'
  function propose(o) {
    if (o.op.op === 'set' && sameVal(o.from, o.to)) { removePending(o.key); return 'noop'; }
    if (sessionLive() && isLoosening({ key: o.rule, from: o.from, to: o.to })) {
      removePending(o.key);
      state.pending.push({
        id: uid(), key: o.key, kind: o.rule, label: o.label || '',
        fromText: o.fromText != null ? String(o.fromText) : String(o.from),
        toText: o.toText != null ? String(o.toText) : String(o.to),
        apply: o.op, createdAt: new Date().toISOString(), dayKey: todayKey()
      });
      return 'pending';
    }
    applyOp(o.op);
    removePending(o.key);
    return 'applied';
  }
  function applyDuePending() {
    var today = todayKey();
    var due = state.pending.filter(function (p) { return p.dayKey !== today; });
    if (!due.length) return false;
    due.forEach(function (p) { applyOp(p.apply); });
    state.pending = state.pending.filter(function (p) { return p.dayKey === today; });
    save();
    return true;
  }
  function afterPropose(result) {
    save();
    if (result === 'pending') toast('Session is live · applies tomorrow ' + state.settings.resetHour);
    else flashSaved();
  }

  /* ==== AUDIO + HAPTICS ==== */
  var actx = null;
  function unlockAudio() {
    try {
      if (!actx) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (C) actx = new C();
      }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { /* ignore */ }
  }
  function chime() {
    if (!state.settings.sound) return;
    unlockAudio();
    if (!actx) return;
    var t0 = actx.currentTime + 0.02;
    [[659.25, 0], [987.77, 0.28]].forEach(function (n) {
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t0 + n[1]);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + n[1] + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + 1.6);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t0 + n[1]);
      o.stop(t0 + n[1] + 1.7);
    });
  }
  function vibrate(pattern) {
    if (!state.settings.vibration || !navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) { /* ignore */ }
  }
  var wakeLock = null;
  function requestWakeLock() {
    var ac = state.activeCooldown;
    if (!ac || ac.finished || wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { if (wakeLock === l) wakeLock = null; });
    }).catch(function () { wakeLock = null; });
  }
  function releaseWakeLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) { /* ignore */ } }
    wakeLock = null;
  }

  /* ==== UI: shell, modal, toast ==== */
  var ui = {
    tab: 'premarket', editor: null, expanded: {}, dayDone: false, showAnyway: null,
    cdSelected: null, holding: false, focusAfter: null
  };
  try {
    var savedTab = typeof sessionStorage !== 'undefined' && sessionStorage.getItem('checkpoint.tab');
    if (savedTab && /^(premarket|trade|cooldown|settings)$/.test(savedTab)) ui.tab = savedTab;
  } catch (e) { /* ignore */ }

  function applyAccent() {
    var c = ACCENTS[state.settings.accent] || ACCENTS.mint;
    var rs = document.documentElement.style;
    rs.setProperty('--accent', 'rgb(' + c.join(',') + ')');
    rs.setProperty('--accent-a', 'rgba(' + c.join(',') + ',.10)');
    rs.setProperty('--accent-b', 'rgba(' + c.join(',') + ',.35)');
  }
  function setTab(tab) {
    if (ui.tab === tab && tab === 'settings') ui.editor = null;
    ui.tab = tab;
    try { sessionStorage.setItem('checkpoint.tab', tab); } catch (e) { /* ignore */ }
    render();
    window.scrollTo(0, 0);
  }
  function render() {
    var view = $('#view');
    if (!view) return;
    var active = document.activeElement;
    var fk = active && active.getAttribute && active.getAttribute('data-fk');
    $$('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === ui.tab)); });
    var html;
    if (ui.tab === 'premarket') html = viewPremarket();
    else if (ui.tab === 'trade') html = viewTrade();
    else if (ui.tab === 'cooldown') html = viewCooldown();
    else html = viewSettings();
    view.innerHTML = '<div class="wrap">' + html + '</div>';
    bindHolds(view);
    var want = ui.focusAfter || fk;
    ui.focusAfter = null;
    if (want) {
      var el = view.querySelector('[data-fk="' + want + '"]');
      if (el) { try { el.focus({ preventScroll: !ui.focusScroll }); } catch (e) { el.focus(); } }
    }
    ui.focusScroll = false;
  }
  function flashSaved() {
    var s = $('.saved');
    if (!s) return;
    s.classList.add('on');
    clearTimeout(flashSaved.t);
    flashSaved.t = setTimeout(function () { s.classList.remove('on'); }, 900);
  }
  function cbx(on, dashed) {
    return '<span class="cb' + (dashed ? ' dashed' : '') + (on ? ' on' : '') + '" aria-hidden="true">' + CHECK_SVG + '</span>';
  }
  function toast(msg, action, ms) {
    var root = $('#toast-root');
    if (!root) return;
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button type="button">' + esc(action.label) + '</button>' : '');
    if (action) t.querySelector('button').addEventListener('click', function () { t.remove(); action.fn(); });
    root.appendChild(t);
    if (ms !== 0) setTimeout(function () { t.remove(); }, ms || 3200);
  }
  // opts: { title, html, actions: [{ label, cls, fn, keepOpen, id }], onOpen }
  function openModal(opts) {
    var root = $('#modal-root');
    var prevFocus = document.activeElement;
    root.innerHTML = '<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">' +
      '<h2 id="m-title">' + esc(opts.title) + '</h2>' + (opts.html || '') +
      '<div class="actions">' + (opts.actions || []).map(function (a, i) {
        return '<button type="button" class="btn block ' + (a.cls || '') + '" data-mi="' + i + '"' + (a.id ? ' id="' + a.id + '"' : '') + (a.disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
      }).join('') + '</div></div></div>';

  /* ==== VIEW: premarket ==== */
  function pmAll() {
    var out = [];
    state.checklists.premarket.categories.forEach(function (c) {
      c.items.forEach(function (it) { out.push(it); });
    });
    return out;
  }
  function pmResolved(it, pmd) { return !!pmd.checked[it.id] || (it.gate && !!pmd.gateNo[it.id]); }
  function pmStats(items, pmd) {
    var req = 0, done = 0;
    items.forEach(function (it) {
      if (it.optional) return;
      req++;
      if (pmd.checked[it.id]) done++;
    });
    return { req: req, done: done };
  }
  function pmCurrent(pmd, now) {
    var reset = hmToMin(state.settings.resetHour);
    var nr = relMin(minOfDay(now), reset);
    var open = pmAll().filter(function (it) { return !it.optional && !pmResolved(it, pmd); });
    var main = open.filter(function (it) { return pmd.later.indexOf(it.id) < 0; });
    var cur = null, curT = -1;
    main.forEach(function (it) {
      if (!it.time) return;
      var t = relMin(hmToMin(it.time), reset);
      if (t <= nr && t > curT) { cur = it; curT = t; }
    });
    if (!cur) cur = main[0] || null;
    if (!cur) {
      cur = pmd.later.map(function (id) { return open.filter(function (it) { return it.id === id; })[0]; }).filter(Boolean)[0] || null;
    }
    var next = null, nextT = 1e9;
    open.forEach(function (it) {
      if (!it.time || it === cur) return;
      var t = relMin(hmToMin(it.time), reset);
      if (t > nr && t < nextT) { next = it; nextT = t; }
    });
    var after = null;
    if (cur) {
      var rest = main.filter(function (it) { return it !== cur; });
      after = rest[0] || null;
    }
    return { cur: cur, next: next, after: after };
  }
  function pmCatFolded(cat, pmd) {
    if (cat.id in pmd.collapsed) return !!pmd.collapsed[cat.id];
    var st = pmStats(cat.items, pmd);
    return st.req > 0 && st.done === st.req;
  }
  function gateButtons(it, pmd, big) {

      '<button type="button" class="no" data-act="pm-gate" data-v="no" data-id="' + esc(it.id) + '" aria-pressed="' + no + '" aria-label="' + esc(it.text) + ': no"' + sz + '>NO</button></div>';

    state.checklists.premarket.categories.forEach(function (cat) {
      var cs = pmStats(cat.items, pmd);

      out += '<section class="cat"><button type="button" class="cat-head" data-act="pm-fold" data-cat="' + esc(cat.id) + '" aria-expanded="' + !folded + '">' +
        '<span><span class="chev" aria-hidden="true">›</span>' + esc(cat.name) + '</span>' +
        '<span class="' + (complete ? 'accent' : 'muted') + '">' + (complete ? cs.done + '/' + cs.req + ' DONE' : cs.done + '/' + cs.req) + '</span></button>';
      if (!folded) {

          if (it.gate) {

  /* ==== VIEW: cooldown ==== */
  var RING_C = 2 * Math.PI * 88;
  function startCooldown(presetId, trigger) {
    var p = findPreset(presetId);
    if (!p) { toast('That preset no longer exists. Check Settings · Preset links.'); return; }
    function go() {
      var ac = state.activeCooldown;
      if (ac) recordCooldown(ac, !ac.finished);
      var t = Date.now();
      state.activeCooldown = {
        presetId: p.id, name: p.name, seconds: p.seconds, startMsg: p.startMsg, endMsg: p.endMsg,
        steps: clone(p.steps), startedAt: t, endsAt: t + p.seconds * 1000, stepsDone: {}, trigger: trigger || 'manual', finished: false
      };
      ui.cdSelected = p.id;
      ui.dayDone = false;
      saveNow();
      unlockAudio();
      requestWakeLock();
      ui.tab = 'cooldown';
      try { sessionStorage.setItem('checkpoint.tab', 'cooldown'); } catch (e) { /* ignore */ }
      render();
      window.scrollTo(0, 0);
    }
    var cur = state.activeCooldown;
    if (cur && !cur.finished && cur.endsAt > Date.now()) {
      confirmModal('Replace the running cooldown?', cur.name + ' has ' + fmtMS((cur.endsAt - Date.now()) / 1000) + ' left. It will be recorded as ended early.', 'Replace', go, 'lock-o');
    } else go();
  }
  function recordCooldown(ac, endedEarly) {
    getDay(todayKey()).cooldowns.push({
      presetId: ac.presetId, startedAt: new Date(ac.startedAt).toISOString(),
      endedAt: new Date(endedEarly ? Date.now() : Math.min(Date.now(), ac.endsAt)).toISOString(),
      endedEarly: !!endedEarly, trigger: ac.trigger
    });
  }
  function finishCooldownIfDue() {
    var ac = state.activeCooldown;
    if (!ac || ac.finished || ac.endsAt > Date.now()) return false;
    ac.finished = true;
    saveNow();
    releaseWakeLock();
    chime();
    vibrate([200, 100, 200]);
    return true;
  }
  function viewCooldown() {
    var ac = state.activeCooldown;
    var running = !!ac;
    if (!ui.cdSelected || !findPreset(ui.cdSelected)) ui.cdSelected = running && findPreset(ac.presetId) ? ac.presetId : (state.presets[0] && state.presets[0].id);
    var out = '<header class="page-head"><h1>Cooldown</h1></header><div class="chips" role="group" aria-label="Presets">' +
      state.presets.map(function (p) {
        return '<button type="button" class="chip' + (running ? ' running' : '') + '" data-act="cd-select" data-id="' + esc(p.id) + '" aria-pressed="' + (p.id === ui.cdSelected) + '">' + esc(p.name) + ' · ' + fmtMS(p.seconds) + '</button>';
      }).join('') + '</div>';
    var showRunning = running && (ui.cdSelected === ac.presetId || !findPreset(ac.presetId));
    if (running && !showRunning) {
      out += '<button type="button" class="btn lock-o block" data-act="cd-select" data-id="' + esc(ac.presetId) + '">Back to running · ' + esc(ac.name) + ' <span data-cd-left>' + fmtMS((ac.endsAt - Date.now()) / 1000) + '</span></button>';
    }
    if (showRunning) {
      var left = Math.max(0, (ac.endsAt - Date.now()) / 1000);
      var done = ac.finished || left <= 0;
      var off = RING_C * (1 - (ac.seconds ? left / ac.seconds : 0));

  function moveEntry(kind, id, toListId, index) {
    var ed = ui.editor;
    if (ed.type === 'preset') {
      var p = findPreset(ed.id);
      var i = p.steps.findIndex(function (s) { return s.id === id; });
      if (i < 0) return;
      var st = p.steps.splice(i, 1)[0];
      p.steps.splice(Math.max(0, Math.min(index, p.steps.length)), 0, st);
    } else {
      var cats = state.checklists[ed.list].categories;
      if (kind === 'cat') {
        var ci = cats.findIndex(function (c) { return c.id === id; });
        if (ci < 0) return;
        var c = cats.splice(ci, 1)[0];
        cats.splice(Math.max(0, Math.min(index, cats.length)), 0, c);
      } else {
        var from = cats.filter(function (c) { return c.items.some(function (x) { return x.id === id; }); })[0];
        if (!from) return;
        var it = from.items.splice(from.items.findIndex(function (x) { return x.id === id; }), 1)[0];
        var to = cats.filter(function (c) { return c.id === toListId; })[0] || from;
        to.items.splice(Math.max(0, Math.min(index, to.items.length)), 0, it);
      }
    }
    save();
    ui.focusAfter = 'h-' + id;
    render();
    flashSaved();
  }
  function moveByKey(kind, id, dir) {
    var ed = ui.editor;
    if (ed.type === 'preset') {
      var p = findPreset(ed.id);
      var i = p.steps.findIndex(function (s) { return s.id === id; });
      moveEntry(kind, id, 'steps', i + dir);
      return;
    }
    var cats = state.checklists[ed.list].categories;
    if (kind === 'cat') {
      var ci = cats.findIndex(function (c) { return c.id === id; });
      if (ci + dir < 0 || ci + dir >= cats.length) return;
      moveEntry(kind, id, null, ci + dir);
      return;
    }
    for (var k = 0; k < cats.length; k++) {
      var idx = cats[k].items.findIndex(function (x) { return x.id === id; });
      if (idx < 0) continue;
      if (idx + dir >= 0 && idx + dir < cats[k].items.length) moveEntry(kind, id, cats[k].id, idx + dir);
      else if (dir < 0 && k > 0) moveEntry(kind, id, cats[k - 1].id, cats[k - 1].items.length);
      else if (dir > 0 && k < cats.length - 1) moveEntry(kind, id, cats[k + 1].id, 0);
      return;
    }
  }

  /* ==== DRAG: pointer reorder ==== */
  var drag = null;
  function dragStart(e, h) {
    if (e.button > 0) return;
    e.preventDefault();
    var kind = h.getAttribute('data-drag');
    var el = h.closest(kind === 'cat' ? '.dnd-cat' : '.dnd-row');
    if (!el) return;
    var rect = el.getBoundingClientRect();
    var ph = document.createElement('div');
    ph.className = 'drop-ph';
    ph.style.height = Math.min(rect.height, kind === 'cat' ? 120 : rect.height) + 'px';
    ph.textContent = 'DROP HERE';
    el.parentNode.insertBefore(ph, el);
    el.style.width = rect.width + 'px';
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.classList.add('lifted');
    document.body.classList.add('dragging');
    drag = { kind: kind, id: h.getAttribute('data-id'), el: el, ph: ph, offY: e.clientY - rect.top, y: e.clientY, handle: h };
    ui.holding = true;
    try { h.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    h.addEventListener('pointermove', dragMove);
    h.addEventListener('pointerup', dragEnd);
    h.addEventListener('pointercancel', dragEnd);
    drag.raf = requestAnimationFrame(dragAutoScroll);
  }
  function dragMove(e) {
    if (!drag) return;
    drag.y = e.clientY;
    drag.el.style.top = (e.clientY - drag.offY) + 'px';
    dragPlace();
  }
  function dragPlace() {
    var y = drag.y, ph = drag.ph, el = drag.el;
    if (drag.kind === 'cat') {
      var box = el.parentNode;
      var sibs = $$('.dnd-cat', box).filter(function (x) { return x !== el; });
      var before = sibs.filter(function (x) { var r = x.getBoundingClientRect(); return y < r.top + Math.min(r.height, 120) / 2; })[0];
      if (before) box.insertBefore(ph, before); else box.appendChild(ph);
      return;
    }
    var lists = $$('.dnd-list', $('#view'));
    var best = null, bestD = Infinity;
    lists.forEach(function (l) {
      var card = l.closest('.dnd-cat') || l;
      var r = card.getBoundingClientRect();
      var d = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
      if (d < bestD) { bestD = d; best = l; }
    });
    if (!best) return;
    var rows = $$('.dnd-row', best).filter(function (x) { return x !== el && x.parentNode === best; });
    var bef = rows.filter(function (x) { var r = x.getBoundingClientRect(); return y < r.top + r.height / 2; })[0];
    if (bef) best.insertBefore(ph, bef); else best.appendChild(ph);
  }
  function dragAutoScroll() {
    if (!drag) return;
    var edge = 70, bottomEdge = window.innerHeight - (window.innerWidth >= 900 ? 70 : 130);
    var dy = 0;
    if (drag.y < edge) dy = -Math.ceil((edge - drag.y) / 5);
    else if (drag.y > bottomEdge) dy = Math.ceil((drag.y - bottomEdge) / 5);
    if (dy) { window.scrollBy(0, dy); dragPlace(); }
    drag.raf = requestAnimationFrame(dragAutoScroll);
  }
  function dragEnd() {

    drag = null;
    cancelAnimationFrame(d.raf);
    d.handle.removeEventListener('pointermove', dragMove);
    d.handle.removeEventListener('pointerup', dragEnd);
    d.handle.removeEventListener('pointercancel', dragEnd);
    document.body.classList.remove('dragging');
    ui.holding = false;
    var parent = d.ph.parentNode;
    var index, listId = null;
    if (d.kind === 'cat') {
      index = $$('.dnd-cat, .drop-ph', parent).filter(function (x) { return x !== d.el && x.parentNode === parent; }).indexOf(d.ph);
    } else {
      listId = parent.getAttribute('data-list-id');
      index = Array.prototype.filter.call(parent.children, function (x) { return x !== d.el && (x.classList.contains('dnd-row') || x === d.ph); }).indexOf(d.ph);
    }
    moveEntry(d.kind, d.id, listId, index);
  }

  /* ==== HOLD: press-and-hold buttons ==== */
  function bindHolds(root) { $$('[data-hold]', root).forEach(bindHold); }
  function bindHold(btn) {
    var sec = Math.max(0.2, +btn.getAttribute('data-sec') || 1);
    var label = btn.querySelector('.hold-label');
    var base = label ? label.textContent : '';
    var start = 0, raf = 0, fired = false;
    function frame() {
      var p = Math.min(1, (performance.now() - start) / (sec * 1000));
      btn.style.setProperty('--fill', p);
      if (label) label.textContent = 'HOLD · ' + (sec * (1 - p)).toFixed(1) + 'S';
      if (p >= 1) {
        fired = true;
        stop();
        onHoldComplete(btn.getAttribute('data-hold'));
        return;
      }
      raf = requestAnimationFrame(frame);
    }
    function down(e) {
      if (btn.disabled || start) return;
      if (e && e.preventDefault) e.preventDefault();
      if (e && e.pointerId != null) { try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
      unlockAudio();
      fired = false;
      start = performance.now();
      ui.holding = true;
      raf = requestAnimationFrame(frame);
    }
    function stop() {
      if (!start) return;
      cancelAnimationFrame(raf);
      start = 0;
      ui.holding = false;
      if (!fired) {
        btn.style.setProperty('--fill', 0);
        if (label) label.textContent = base;
      }
    }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('lostpointercapture', stop);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    btn.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) down(e); });
    btn.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') stop(); });
    btn.addEventListener('blur', stop);
  }
  function onHoldComplete(kind) {
    var key = todayKey();
    if (kind === 'enter') {
      getDay(key).entered = true;
      vibrate(60);
      save();
      render();
    } else if (kind === 'urge') {
      getDay(key).urges.push(new Date().toISOString());
      vibrate(60);
      save();
      startCooldown(state.settings.presetLinks.urge, 'urge');
    } else if (kind === 'endEarly') {
      var ac = state.activeCooldown;
      if (ac) {
        recordCooldown(ac, true);
        state.activeCooldown = null;
        releaseWakeLock();
        saveNow();
        toast('Cooldown ended early · recorded');
      }
      render();
    }
  }

  /* ==== DATA: export/import/reset ==== */
  function stampName(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function exportData(silent) {
    var d = new Date();
    state.settings.lastExportAt = d.toISOString();
    saveNow();
    var payload = clone(state);
    payload.exported_at = d.toISOString();
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'checkpoint-backup-' + stampName(d) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    if (!silent) toast('Exported ' + a.download);
    if (ui.tab === 'settings' && !ui.editor) render();

  function validImport(obj) {
    return isObj(obj) && obj.schema != null && isObj(obj.checklists);
  }
  // Adds categories, items, presets and days whose ids don't exist locally. Returns counts.
  function mergeImport(local, inc) {
    var n = { categories: 0, items: 0, presets: 0, days: 0 };
    ['premarket', 'trade', 'sessionOver'].forEach(function (l) {
      var incL = inc.checklists[l];
      if (!incL || !Array.isArray(incL.categories)) return;
      var locCats = local.checklists[l].categories;
      var have = {};
      locCats.forEach(function (c) { c.items.forEach(function (i) { have[i.id] = true; }); });
      incL.categories.forEach(function (ic) {
        if (!ic || !ic.id || !Array.isArray(ic.items)) return;
        var lc = locCats.filter(function (c) { return c.id === ic.id; })[0];
        if (!lc) {
          var fresh = clone(ic);
          fresh.items = fresh.items.filter(function (i) { return i && i.id && !have[i.id]; });
          fresh.items.forEach(function (i) { have[i.id] = true; });
          locCats.push(fresh);
          n.categories++;
          n.items += fresh.items.length;
          return;
        }
        ic.items.forEach(function (ii, idx) {
          if (!ii || !ii.id || have[ii.id]) return;
          var pos = 0;
          for (var k = idx - 1; k >= 0; k--) {
            var prevId = ic.items[k] && ic.items[k].id;
            var at = lc.items.findIndex(function (x) { return x.id === prevId; });
            if (at >= 0) { pos = at + 1; break; }
          }
          lc.items.splice(pos, 0, clone(ii));
          have[ii.id] = true;
          n.items++;
        });
      });
    });
    if (Array.isArray(inc.presets)) {
      inc.presets.forEach(function (p) {
        if (!p || !p.id || findPresetIn(local, p.id)) return;
        local.presets.push(clone(p));
        n.presets++;
      });
    }
    if (isObj(inc.days)) {
      Object.keys(inc.days).forEach(function (k) {
        if (local.days[k]) return;
        local.days[k] = clone(inc.days[k]);
        n.days++;
      });
    }
    return n;
  }
  function summary(n) {
    var parts = [];
    function add(v, one, many) { if (v) parts.push('Added ' + v + ' ' + (v === 1 ? one : many)); }
    add(n.categories, 'category', 'categories');
    add(n.items, 'item', 'items');
    add(n.presets, 'preset', 'presets');
    add(n.days, 'day', 'days');
    return parts.length ? parts.join(', ').replace(/, Added/g, ',') + '.' : 'Nothing new to add. Everything was already here.';
  }
  function handleImportFile(file) {

      if (!validImport(obj)) { openModal({ title: 'Not a Checkpoint backup', html: '<p>The file needs "schema" and "checklists". Nothing was changed.</p>', actions: [{ label: 'OK', cls: 'ghost' }] }); return; }
      openModal({
        title: 'Import backup',
        html: '<p>' + esc(file.name) + (obj.exported_at ? ' · exported ' + esc(fmtStamp(new Date(obj.exported_at))) : '') + '</p>',
        actions: [
          { label: 'Merge (recommended)', cls: 'primary', fn: function () {

            render();
            openModal({ title: 'Merged', html: '<p>' + esc(summary(n)) + ' Your local settings were kept.</p>', actions: [{ label: 'OK', cls: 'ghost' }] });
          } },
          { label: 'Replace everything', cls: 'danger-o', fn: function () {
            typedConfirm({

              word: 'REPLACE', okLabel: 'Replace everything',

      var links = LINK_LABELS.filter(function (l) { return state.settings.presetLinks[l[0]] === id; }).map(function (l) { return l[1]; });
      if (links.length) {
        openModal({ title: 'Can\'t delete "' + p.name + '"', html: '<p>It is linked to: ' + esc(links.join(', ')) + '. Choose another preset for ' + (links.length === 1 ? 'that link' : 'those links') + ' in Settings · Preset links first.</p>', actions: [{ label: 'OK', cls: 'ghost' }] });
        return;
      }
      confirmModal('Delete "' + p.name + '"?', 'This preset and its steps are removed.', 'Delete preset', function () {
        state.presets = state.presets.filter(function (x) { return x.id !== id; });
        state.pending = state.pending.filter(function (x) { return x.key.indexOf('preset.' + id + '.') !== 0; });
        save();
        ui.editor = null;
        render();
      }, 'danger-o');
    }
  };

  var CHANGES = {
    'rule-num': function (el) {
      var k = el.getAttribute('data-key');
      var v = Math.round(Number(el.value));
      if (el.value === '' || !isFinite(v) || v < 0) { render(); return; }
      changeSetting('rules.' + k, 'settings.rules.' + k, v, '$' + state.settings.rules[k], '$' + v);
      render();
    },
    'hold-num': function (el) {
      var k = el.getAttribute('data-key');
      var v = Math.round(Number(el.value));
      if (el.value === '' || !isFinite(v) || v < 1) v = 1;
      if (v > 60) v = 60;
      changeSetting('behaviour.' + k, 'settings.behaviour.' + k, v, state.settings.behaviour[k] + 's', v + 's');
      render();
    },
    'text-setting': function (el) { setPath(state, el.getAttribute('data-path'), el.value); save(); flashSaved(); },
    'link': function (el) {
      var k = el.getAttribute('data-link');
      var from = findPreset(state.settings.presetLinks[k]), to = findPreset(el.value);
      changeSetting('presetLinks.' + k, 'settings.presetLinks.' + k, el.value, from ? from.name : '?', to ? to.name : '?');
      render();
    },
    'session': function (el) {
      if (!/^\d{2}:\d{2}/.test(el.value)) { render(); return; }
      var cur = state.settings.session;
      var base = clone(targetValue('session', cur));
      base[el.getAttribute('data-field')] = el.value.slice(0, 5);
      changeSetting('session', 'settings.session', base, cur.start + '–' + cur.end, base.start + '–' + base.end);
      render();
    },
    'reset-hour': function (el) {
      if (!/^\d{2}:\d{2}/.test(el.value)) { render(); return; }
      state.settings.resetHour = el.value.slice(0, 5);
      save();
      render();
      flashSaved();
    },
    'cat-name': function (el) {
      var cat = findCat(listOfEditor(), el.getAttribute('data-id'));
      if (!cat) return;
      cat.name = el.value.trim() || 'UNTITLED';
      save();
      flashSaved();
    },
    'item-field': function (el) {
      var list = listOfEditor(), id = el.getAttribute('data-id'), f = el.getAttribute('data-field');
      var it = findItem(list, id);
      if (!it) return;
      var v = f === 'time' ? (el.value || '').slice(0, 5) : el.value;
      if (list === 'trade') {
        var res = propose({ key: 'trade.item.' + id + '.' + f, rule: 'trade.itemEdit', from: it[f], to: v, fromText: '"' + it[f] + '"', toText: '"' + v + '"', op: { op: 'editItem', list: list, itemId: id, field: f, value: v } });
        afterPropose(res);
        if (res === 'pending') { setTimeout(render, 0); return; }
      } else {
        it[f] = v;
        save();
        flashSaved();
      }
      var lbl = $('[data-label-for="' + id + '"]');
      if (lbl && f === 'text') { lbl.textContent = v || 'New item'; lbl.classList.toggle('empty', !v); }
      if (f === 'time') setTimeout(render, 0);
    },
    'preset-field': function (el) {
      var p = findPreset(ui.editor.id);
      p[el.getAttribute('data-field')] = el.value;
      save();
      flashSaved();
      if (el.getAttribute('data-field') === 'name') { var h = $('.editor-head h1'); if (h) h.textContent = el.value || 'Preset'; }
    },
    'preset-dur': function (el) {
      var p = findPreset(ui.editor.id);
      var wrap = el.closest('.row');
      var m = Math.max(0, Math.round(Number(wrap.querySelector('[data-part="m"]').value) || 0));
      var s = Math.max(0, Math.min(59, Math.round(Number(wrap.querySelector('[data-part="s"]').value) || 0)));
      var to = Math.max(1, m * 60 + s);
      var res = propose({ key: 'preset.' + p.id + '.seconds', rule: 'preset.seconds', from: p.seconds, to: to, fromText: fmtMS(p.seconds), toText: fmtMS(to), op: { op: 'presetSet', presetId: p.id, field: 'seconds', value: to } });
      if (res === 'noop') removePending('preset.' + p.id + '.seconds');
      afterPropose(res);
      render();
    },
    'step-text': function (el) {
      var p = findPreset(ui.editor.id);
      var st = p.steps.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (st) { st.text = el.value; save(); flashSaved(); }
    }
  };

  function bindEvents() {
    $$('.tab').forEach(function (t) { t.addEventListener('click', function () { setTab(t.getAttribute('data-tab')); }); });
    var view = $('#view');
    view.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el || !view.contains(el) || el.disabled) return;
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (fn) fn(el, e);
    });
    view.addEventListener('change', function (e) {
      var el = e.target.closest('[data-change]');
      if (!el) return;
      var fn = CHANGES[el.getAttribute('data-change')];
      if (fn) fn(el, e);
    });
    view.addEventListener('pointerdown', function (e) {
      var h = e.target.closest('[data-drag]');
      if (h && view.contains(h)) dragStart(e, h);
    });
    view.addEventListener('keydown', function (e) {
      var h = e.target.closest && e.target.closest('[data-drag]');
      if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      moveByKey(h.getAttribute('data-drag'), h.getAttribute('data-id'), e.key === 'ArrowUp' ? -1 : 1);
    });
    $('#import-file').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) handleImportFile(f);
    });
    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { flushSave(); return; }
      onResume();
    });
    window.addEventListener('focus', onResume);
    window.addEventListener('pagehide', flushSave);
    window.addEventListener('storage', function (e) {
      if (e.key !== KEY || !e.newValue) return;
      try { state = normalise(JSON.parse(e.newValue)); applyAccent(); render(); } catch (err) { /* ignore */ }
    });
  }
  function onResume() {
    applyDuePending();
    if (finishCooldownIfDue()) { render(); return; }
    tickCooldownDom();
    requestWakeLock();
    if (!ui.holding && ui.tab !== 'settings') render();
  }

  /* ==== PWA: service worker ==== */
  function registerSW() {
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
    function offer(worker) {
      toast('Update available', { label: 'Reload', fn: function () { worker.postMessage('SKIP_WAITING'); } }, 0);
    }
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w);
        });
      });
      setInterval(function () { reg.update().catch(function () { /* offline */ }); }, 60 * 60 * 1000);
    }).catch(function () { /* ignore */ });
  }

  /* ==== BOOT ==== */
  var lastSlow = 0;
  function tick() {
    if (finishCooldownIfDue()) { if (!ui.holding) render(); return; }
    tickCooldownDom();
    var t = Date.now();
    if (t - lastSlow >= 20000) {
      lastSlow = t;
      var applied = applyDuePending();
      if (!ui.holding && !drag && (ui.tab !== 'settings' || (applied && !ui.editor))) render();
    }
  }
  function init() {
    load();
    applyDuePending();
    applyAccent();
    bindEvents();
    finishCooldownIfDue();
    render();
    if (loadNotice) toast(loadNotice, null, 0);
    if (navigator.storage && navigator.storage.persist) {
      try {
        navigator.storage.persisted().then(function (p) { if (!p) return navigator.storage.persist(); }).catch(function () { /* ignore */ });
      } catch (e) { /* ignore */ }
    }
    requestWakeLock();
    lastSlow = Date.now();
    setInterval(tick, 250);
    registerSW();
  }

  var api = {
    init: init,
    makeDefaults: makeDefaults,
    tradingDayKey: tradingDayKey,
    sessionPhase: sessionPhase,
    isLoosening: isLoosening,
    mergeImport: mergeImport,
    escapeHTML: escapeHTML,
    fillMissing: fillMissing,
    get state() { return state; },
    ui: ui
  };
  return api;
})();

if (typeof document !== 'undefined' && document.getElementById('view')) App.init();
</script>
</body>
</html>
